  let html;
  if(ui.vista === "edu" && ui.edu) html = testataEdu() + vEdu();
  else if(!off()){ ui.vista = "scelta"; html = testataMin() + vScelta(); }
  else html = testata() + navigazione() + vistaOfficina();
  $("#app").innerHTML = html;
  $("#modale").innerHTML = ui.modale ? vModale() : "";
  if(id){ const el = document.getElementById(id); if(el && !ui.focus){ el.focus({preventScroll:true}); try{ if(s1 != null) el.setSelectionRange(s1, s2); }catch(e){} } }
  if(ui.focus){ const el = document.getElementById(ui.focus); ui.focus = null; if(el) el.focus(); }
  else if(ui.modale){ const f = $("#modale [autofocus]") || $("#modale input, #modale button, #modale textarea"); if(f && !$("#modale").contains(document.activeElement)) f.focus(); }
  dopoRender();
}

/* ---------- esportare e importare ---------- */
function scarica(nome, testo){
  try{
    const bl = new Blob([testo], {type:"application/json"}); const u = URL.createObjectURL(bl);
    const a = document.createElement("a"); a.href = u; a.download = nome; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 1000);
  }catch(e){}
  ui.modale = {tipo:"testo", nome, testo}; render();
}
function nomeFile(t){ return t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
function importaOggetto(obj, sostituisci){
  let n = 0; const lista = [];
  if(obj && obj.tipo === "officina" && obj.officina) lista.push(obj.officina);
  else if(obj && Array.isArray(obj.officine)) lista.push(...obj.officine);
  else throw new Error("formato");
  lista.forEach(o => { if(!o || !o.id || !o.nome) return; normalizzaOfficina(o); const i = D.officine.findIndex(x => x.id === o.id); if(i >= 0) D.officine[i] = o; else D.officine.push(o); n++; });
  if(sostituisci && obj.impostazioni){ D.impostazioni = Object.assign(impostazioniBase(), obj.impostazioni); }
  if(sostituisci && Array.isArray(obj.listino)) D.listino = obj.listino;
  salva(); return n;
}
async function importa(testo){
  let obj, n;
  try{ obj = JSON.parse(testo); n = importaOggetto(obj, !!($("#imp-sost") && $("#imp-sost").checked)); }
  catch(e){ toast("Non riesco a leggere il file. Controlla che sia una copia di BiciLab."); return; }
  let nf = 0;
  if(obj.foto && typeof obj.foto === "object"){
    toast("Carico le foto...");
    for(const [id, u] of Object.entries(obj.foto)){ try{ await fotoPut(id, dataUrlInBlob(u)); if(urlFoto[id]){ URL.revokeObjectURL(urlFoto[id]); delete urlFoto[id]; } nf++; }catch(e){} }
  }
  pulisciFoto();
  toast((n === 1 ? "Ho caricato 1 officina" : "Ho caricato " + n + " officine") + (nf ? " e " + nf + " foto." : ".")); render();
}

/* ---------------- ASPETTO E MOVIMENTO ---------------- */
/* Profilo di un ingranaggio centrato in 0,0: r = raggio esterno, n = denti, p = altezza del dente */
function ingranaggio(r, n, p){
  const ri = r - p, s = Math.PI * 2 / n, pt = [];
  for(let i = 0; i < n; i++){ const a = i * s; pt.push([ri, a], [r, a + s * .14], [r, a + s * .36], [ri, a + s * .5]); }
  return "M" + pt.map(([q, a]) => (q * Math.cos(a)).toFixed(1) + " " + (q * Math.sin(a)).toFixed(1)).join(" L") + " Z";
}
function fori(r){ let s = ""; for(let i = 0; i < 5; i++){ const a = i * Math.PI * 2 / 5; s += '<circle cx="' + (r * .38 * Math.cos(a)).toFixed(1) + '" cy="' + (r * .38 * Math.sin(a)).toFixed(1) + '" r="' + (r * .1).toFixed(1) + '"/>'; } return s; }
function svgIngr(n, r, t, inv){
  const R = r + 4;
  return '<svg viewBox="' + (-R) + ' ' + (-R) + ' ' + 2 * R + ' ' + 2 * R + '"><g class="scorri"><g class="gira' + (inv ? " inv" : "") + '" style="--t:' + t + 's"><path d="' + ingranaggio(r, n, Math.max(6, r * .12)) + '"/><circle r="' + (r * .62).toFixed(1) + '"/><circle r="' + (r * .16).toFixed(1) + '"/>' + fori(r) + '</g></g></svg>';
}
function svgRuota(r, n, t){
  const R = r + 6; let s = "";
  for(let i = 0; i < n; i++){ const a = i * Math.PI * 2 / n, b = a + (i % 2 ? .38 : -.38), q = r * .07;
    s += '<line x1="' + (q * Math.cos(a)).toFixed(1) + '" y1="' + (q * Math.sin(a)).toFixed(1) + '" x2="' + (r * .9 * Math.cos(b)).toFixed(1) + '" y2="' + (r * .9 * Math.sin(b)).toFixed(1) + '"/>'; }
  return '<svg viewBox="' + (-R) + ' ' + (-R) + ' ' + 2 * R + ' ' + 2 * R + '"><g class="scorri"><g class="gira" style="--t:' + t + 's"><circle r="' + r + '" style="stroke-width:7"/><circle r="' + (r * .9).toFixed(1) + '"/><circle r="' + (r * .07).toFixed(1) + '"/><g class="sottile">' + s + '</g></g></g></svg>';
}
function svgCoppia(){

  const d = 185, a = -.5, x = 170 + d * Math.cos(a), y = 170 + d * Math.sin(a);
  return '<svg viewBox="0 0 400 360"><g transform="translate(170 170)"><g class="gira" style="--t:150s"><path d="' + ingranaggio(150, 36, 15) + '"/><circle r="93"/><circle r="24"/>' + fori(150) + '</g></g>' +
    '<g transform="translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') rotate(15)"><g class="gira inv" style="--t:50s"><path d="' + ingranaggio(50, 12, 15) + '"/><circle r="26"/><circle r="8"/></g></g></svg>';
}

function svgDado(t){

function aggiornaSfondo(){
  const el = $("#sfondo"); if(!el) return;
  const o = ui.vista !== "edu" ? off() : null;
  const col = o ? o.colore : "#C2410C";
  document.documentElement.style.setProperty("--c-off", col);
  const quanti = !P.disegni ? 0 : (o ? Math.min(DECO.length, 3 + nAbil(o)) : 4);

  const da = (!chiaveSfondo || cambioColore) ? 0 : Math.min(decoPrima, quanti);
  chiaveSfondo = chiave; decoPrima = quanti;

}

function dopoRender(){

  if(ui.trans){ const m = $("#main"); if(m && vivo) m.classList.add("t-" + ui.trans); ui.trans = null; }
  if(ui.transPannello){ const p = $('[role="tabpanel"]'); if(p && vivo) p.classList.add("t-pannello"); ui.transPannello = false; }

function contaSu(){
  document.querySelectorAll("[data-conta]").forEach((el, i) => {
    const fine = +el.dataset.conta, t0 = performance.now() + i * 90, dur = 650;
    el.textContent = euro(0);
    const passo = ora => { const p = Math.max(0, Math.min(1, (ora - t0) / dur)); el.textContent = euro(fine * (1 - Math.pow(1 - p, 3))); if(p < 1) requestAnimationFrame(passo); };
    requestAnimationFrame(passo);
  });
}
function onda(x, y, col){
  const d = document.createElement("span"); d.className = "onda"; d.style.left = x + "px"; d.style.top = y + "px"; d.style.setProperty("--c", col);
  $("#effetti").appendChild(d); d.addEventListener("animationend", () => d.remove());
}
function coriandoli(x, y, n, forza){
  if(!P.movimento) return;
  const col = ["#C2410C","#1F4E5F","#F6C445","#2E7D32","#BE185D","#1D4ED8"]; const box = $("#effetti"); const f = forza || 120;
  for(let i = 0; i < n; i++){
    const d = document.createElement("span"); d.className = "coriandolo" + (i % 3 === 0 ? " tondo" : "");
    const a = Math.random() * Math.PI * 2, v = f * (.45 + Math.random() * .75);
    d.style.left = x + "px"; d.style.top = y + "px";
    d.style.setProperty("--dx", (Math.cos(a) * v).toFixed(0) + "px"); d.style.setProperty("--dy", (Math.sin(a) * v + f * .55).toFixed(0) + "px");
    d.style.setProperty("--r", (Math.random() * 720 - 360).toFixed(0) + "deg"); d.style.setProperty("--c", col[i % col.length]);
    d.style.animationDuration = (.75 + Math.random() * .5).toFixed(2) + "s";
    box.appendChild(d); d.addEventListener("animationend", () => d.remove());
  }
}

/* ---------------- FOTO ----------------
   Le foto vengono ridotte (lato lungo 1200 px, JPEG) e salvate nel database del browser (IndexedDB).
   Se IndexedDB non c'è, si usa il salvataggio normale del browser, che è più piccolo. */
const MOMENTI = {arrivo:"All'arrivo", lavoro:"Durante il lavoro", consegna:"Alla consegna"};
const TOCCO = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);
const MAX_FOTO = 24, LSF = "bicilab.foto.";
const urlFoto = {}, promFoto = {};
let dbFoto = null, fotoInLS = false;
function apriDbFoto(){
  if(dbFoto) return dbFoto;
  dbFoto = new Promise((ok, ko) => {
    try{
      const rq = indexedDB.open("bicilab-foto", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("foto");
      rq.onsuccess = () => ok(rq.result); rq.onerror = () => ko(rq.error); rq.onblocked = () => ko(new Error("bloccato"));
    }catch(e){ ko(e); }
  }).catch(() => { fotoInLS = true; return null; });
  return dbFoto;
}
function opFoto(db, modo, fn){
  return new Promise((ok, ko) => { const tr = db.transaction("foto", modo); const rq = fn(tr.objectStore("foto")); tr.oncomplete = () => ok(rq ? rq.result : undefined); tr.onerror = () => ko(tr.error); tr.onabort = () => ko(tr.error || new Error("annullato")); });
}
async function fotoPut(id, blob){ const db = await apriDbFoto(); if(db) return opFoto(db, "readwrite", st => st.put(blob, id)); localStorage.setItem(LSF + id, await blobInDataUrl(blob)); }
async function fotoGet(id){ const db = await apriDbFoto(); if(db) return opFoto(db, "readonly", st => st.get(id)); const u = localStorage.getItem(LSF + id); return u ? dataUrlInBlob(u) : null; }
async function fotoDel(id){ const db = await apriDbFoto(); if(db) return opFoto(db, "readwrite", st => st.delete(id)); localStorage.removeItem(LSF + id); }
async function fotoChiavi(){ const db = await apriDbFoto(); if(db) return opFoto(db, "readonly", st => st.getAllKeys()); return Object.keys(localStorage).filter(k => k.startsWith(LSF)).map(k => k.slice(LSF.length)); }
function blobInDataUrl(b){ return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => ko(r.error); r.readAsDataURL(b); }); }
function dataUrlInBlob(u){
  const i = u.indexOf(","); const mime = (u.slice(0, i).match(/data:([^;]+)/) || [])[1] || "image/jpeg";
  const bin = atob(u.slice(i + 1)); const a = new Uint8Array(bin.length); for(let k = 0; k < bin.length; k++) a[k] = bin.charCodeAt(k);
  return new Blob([a], {type:mime});
}
function urlDi(id){
  if(urlFoto[id]) return Promise.resolve(urlFoto[id]);
  if(!promFoto[id]) promFoto[id] = fotoGet(id).then(b => { if(!b) return null; urlFoto[id] = URL.createObjectURL(b); return urlFoto[id]; }).catch(() => null).finally(() => { delete promFoto[id]; });
  return promFoto[id];
}
function dimenticaFoto(id){ if(urlFoto[id]){ URL.revokeObjectURL(urlFoto[id]); delete urlFoto[id]; } }
function imgFoto(id, alt, cls){ return '<img data-foto="' + id + '" alt="' + h(alt) + '"' + (cls ? ' class="' + cls + '"' : "") + (urlFoto[id] ? ' src="' + urlFoto[id] + '"' : "") + '>'; }
function caricaFotoVisibili(){
  document.querySelectorAll("img[data-foto]:not([src])").forEach(img => {
    urlDi(img.dataset.foto).then(u => { if(u) img.src = u; else { const b = img.closest(".foto"); if(b) b.classList.add("mancante"); } });
  });
}
function fotoCopertina(s){ const l = s.foto || []; return l.find(f => f.momento === "arrivo" && !f.parte) || l.find(f => f.momento === "arrivo") || l[0] || null; }
function fotoAperta(){ const m = ui.modale; if(!m || m.tipo !== "foto") return null; const s = trovaScheda(m.sid); return s ? s.foto.find(f => f.id === m.fid) : null; }
function etichettaFoto(f){ const parte = CONTROLLI.find(c => c.id === f.parte); return f.nota || (parte ? parte.n : MOMENTI[f.momento]); }
function btnFoto(f){ return '<button class="foto" id="ft-' + f.id + '" data-act="apriFoto" data-id="' + f.id + '" aria-label="Apri la foto: ' + h(etichettaFoto(f)) + '">' + imgFoto(f.id, "") + '<span class="foto-etich">' + h(etichettaFoto(f)) + '</span></button>'; }
function galleriaFoto(s, filtro, piccola){ const l = s.foto.filter(filtro); return l.length ? '<div class="foto-griglia' + (piccola ? " piccola" : "") + '">' + l.map(btnFoto).join("") + '</div>' : ""; }
function pulsantiFoto(m, p, piccolo, testoCam){
  const cls = "btn" + (piccolo ? " btn-piccolo" : "");
  return '<button class="' + cls + '" data-act="scattaFoto" data-m="' + m + '" data-p="' + (p || "") + '" data-cam="1">' + ico("camera") + ' ' + (testoCam || "Scatta una foto") + '</button>' +
    '<button class="' + cls + '" data-act="scattaFoto" data-m="' + m + '" data-p="' + (p || "") + '">' + ico("immagine") + ' Carica una foto</button>';
}
function momentoDaStato(s){ return {lavorazione:"lavoro", pronta:"consegna", consegnata:"consegna"}[s.stato] || "arrivo"; }
function primaDopo(s){
  const a = s.foto.find(f => f.momento === "arrivo" && !f.parte) || s.foto.find(f => f.momento === "arrivo");
  const c = s.foto.slice().reverse().find(f => f.momento === "consegna");
  if(!a || !c) return "";
  return '<div class="prima-dopo"><figure>' + btnFoto(a) + '<figcaption>Prima</figcaption></figure><span class="pd-freccia" aria-hidden="true">' + ico("dx") + '</span><figure>' + btnFoto(c) + '<figcaption>Dopo</figcaption></figure></div>';
}
function sezioneFoto(s){
  const m = momentoDaStato(s);
  const gruppi = Object.keys(MOMENTI).map(k => { const n = s.foto.filter(f => f.momento === k).length; return n ? '<h4>' + MOMENTI[k] + ' (' + n + ')</h4>' + galleriaFoto(s, f => f.momento === k) : ""; }).join("");
  const consiglio = m === "consegna" && !s.foto.some(f => f.momento === "consegna") ? '<div class="esito esito-info">' + ico("camera") + '<span>Fotografate la bici riparata: così avete il prima e il dopo.</span></div>' : "";
  return '<section class="carta"><h3 style="margin-top:0">' + ico("camera") + ' Foto della bici (' + s.foto.length + ')</h3>' + primaDopo(s) + (gruppi || '<p>Ancora nessuna foto.</p>') + consiglio +
    '<p class="aiuto">Le nuove foto vanno in «' + MOMENTI[m] + '»: lo puoi cambiare aprendo la foto. Fotografate solo la bici, senza persone.</p><div class="azioni-riga">' + pulsantiFoto(m, "") + '</div></section>';
}
function fotoStampa(s){
  if(!s.foto.length) return "";
  const a = s.foto.find(f => f.momento === "arrivo" && !f.parte) || s.foto.find(f => f.momento === "arrivo");
  const c = s.foto.slice().reverse().find(f => f.momento === "consegna");
  const fig = (f, cap) => '<figure><img src="' + (urlFoto[f.id] || "") + '" alt=""><figcaption>' + h(cap) + '</figcaption></figure>';
  const did = f => { const parte = CONTROLLI.find(x => x.id === f.parte); return [MOMENTI[f.momento], parte ? parte.n : "", f.nota].filter(Boolean).join(" · "); };
  const pd = a && c; const altre = s.foto.filter(f => !(pd && (f === a || f === c)));
  return '<div class="st-box"><h3>Foto della bici</h3>' +
    (pd ? '<div class="st-foto st-pd">' + fig(a, "PRIMA · " + (a.nota || "all'arrivo")) + fig(c, "DOPO · " + (c.nota || "alla consegna")) + '</div>' : "") +
    (altre.length ? '<div class="st-foto">' + altre.slice(0, 6).map(f => fig(f, did(f))).join("") + '</div>' : "") +
    (altre.length > 6 ? '<p style="font-size:8.5pt;margin:2px 0 0">Altre ' + (altre.length - 6) + ' foto nella scheda digitale.</p>' : "") + '</div>';
}
function canvasBlob(c){
  return new Promise(ok => { const q = .72; if(c.toBlob) c.toBlob(b => ok(b || dataUrlInBlob(c.toDataURL("image/jpeg", q))), "image/jpeg", q); else ok(dataUrlInBlob(c.toDataURL("image/jpeg", q))); });
}
async function preparaFoto(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error("immagine")); i.src = url; });
    const sc = Math.min(1, 1200 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.naturalWidth * sc)); c.height = Math.max(1, Math.round(img.naturalHeight * sc));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await canvasBlob(c);
  } finally { URL.revokeObjectURL(url); }
}
async function salvaFotoBlob(b, dest){
  const o = D.officine.find(x => x.id === dest.oid); const s = o && o.schede.find(x => x.id === dest.sid);
  if(!s || !b) return false;
  if(s.foto.length >= MAX_FOTO){ toast("Questa scheda ha già " + MAX_FOTO + " foto. Elimina una foto per aggiungerne un'altra."); return false; }
  const id = "f" + uid();
  try{ await fotoPut(id, b); }
  catch(e){ toast("Lo spazio per le foto è finito. Elimina qualche foto oppure salva una copia e cancella le officine vecchie."); return false; }
  urlFoto[id] = URL.createObjectURL(b);
  s.foto.push({id, momento:dest.m || "arrivo", parte:dest.p || "", nota:"", data:new Date().toISOString()});
  s.aggiornata = new Date().toISOString(); salva();
  ui.pop = "ft-" + id; render();
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  return true;
}
async function aggiungiFoto(files, dest){
  toast(files.length > 1 ? "Preparo " + files.length + " foto..." : "Preparo la foto...");
  let n = 0;
  for(const f of files){
    if(f.type && !f.type.startsWith("image/")) continue;

function chiudiCamera(){ if(flusso){ flusso.getTracks().forEach(t => t.stop()); flusso = null; } const b = $("#camera"); if(b) b.remove(); }
async function scattaDaCamera(){
  const v = $("#cam-video"); if(!v || !v.videoWidth) return;
  const sc = Math.min(1, 1200 / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement("canvas"); c.width = Math.round(v.videoWidth * sc); c.height = Math.round(v.videoHeight * sc);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  if(P.movimento){ const f = document.createElement("div"); f.className = "flash"; $("#camera").appendChild(f); f.addEventListener("animationend", () => f.remove()); }
  if(await salvaFotoBlob(await canvasBlob(c), ui.camDest)){
    ui.camN++; const el = $("#cam-conta"); if(el) el.textContent = ui.camN === 1 ? "1 foto aggiunta alla scheda." : ui.camN + " foto aggiunte alla scheda.";
  }
}

  camScatta: () => scattaDaCamera(),
  camChiudi: () => { chiudiCamera(); render(); },
  camCarica: () => { const d = ui.camDest; chiudiCamera(); apriSceltaFile(d, false); },
  listinoAggiungi: () => { const id = "r" + uid(); D.listino.push({id, nome:"Nuovo ricambio", prezzo:1}); salva(); ui.focus = "ln-" + id; render(); },
  listinoElimina: el => { D.listino = D.listino.filter(x => x.id !== el.dataset.id); salva(); render(); },
  copiaTesto: () => { const t = $("#testo-esporta"); t.select(); let ok = false; try{ ok = document.execCommand("copy"); }catch(e){} if(navigator.clipboard) navigator.clipboard.writeText(t.value).then(() => toast("Testo copiato."), () => {}); else toast(ok ? "Testo copiato." : "Seleziona il testo e copialo."); }
};

/* ---------------- MODULI (invio) ---------------- */
const S = {
  salvaOfficina: f => {
    const nome = f.nome.value.trim();
    if(!nome){ ui.modale = {tipo:"officina", err:{nome:"Scrivi il nome dell'officina."}, membri:f.membri.value}; render(); $("#off-nome").focus(); return; }
    const o = normalizzaOfficina({id:uid(), nome, membri:f.membri.value.trim(), simbolo:f.simbolo.value, colore:f.colore.value, creata:new Date().toISOString()});
    D.officine.push(o); ui.officinaId = o.id; ui.modale = null; salva(); vai("banco"); toast("L'officina «" + nome + "» è aperta!");
  },
  salvaCliente: f => {
    const d = {nome:f.nome.value.trim(), cognome:f.cognome.value.trim(), telefono:f.telefono.value.trim(), note:f.note.value.trim()};
    if(!d.nome){ ui.errCli = {nome:"Scrivi il nome del cliente."}; ui.bozzaCli = d; ui.focus = "cli-nome"; render(); return; }
    ui.errCli = null; ui.bozzaCli = null; const o = off(); const ctx = f.dataset.ctx;
    if(ctx === "modifica"){ const c = trovaCliente(f.dataset.id); Object.assign(c, d); salva(); ui.modCliente = false; render(); toast("Cliente aggiornato."); return; }
    const c = {id:uid(), ...d, creato:new Date().toISOString()}; o.clienti.push(c); salva(); ui.formCliente = false;
    if(ctx === "wiz"){ ui.wizCliente = c.id; const s = creaScheda(c.id); ui.schedaId = s.id; ui.passo = 2; vai("wizard"); toast("Cliente registrato: " + nomeCliente(c) + "."); }
    else { render(); toast("Cliente registrato: " + nomeCliente(c) + "."); }
    controllaAbilitazioni();
  },
  lavoroLibero: f => {
    const s = trovaScheda(ui.schedaId); const nome = f.nome.value.trim(); const m = parseInt(f.min.value, 10);
    if(!nome){ toast("Scrivi il nome del lavoro."); f.nome.focus(); return; }
    s.lavori.push({id:"x-" + uid(), nome, min:isNaN(m) ? 15 : Math.max(5, Math.min(240, m)), fatto:false}); ui.msg = null; toccaScheda(s); render();
  },
  aggiungiRicambio: f => {
    const s = trovaScheda(ui.schedaId); const x = D.listino.find(r => r.id === f.rid.value); if(!x) return;
    const r = s.ricambi.find(y => y.rid === x.id && !y.recupero);
    if(r) r.qta++; else s.ricambi.push({rid:x.id, nome:x.nome, prezzo:+x.prezzo, qta:1, origine:null});
    toccaScheda(s); render(); toast("Aggiunto: " + x.nome + ".");
  },
  ricambioRecupero: f => {
    const s = trovaScheda(ui.schedaId); const nome = f.nome.value.trim(); const p = leggiNumero(f.prezzo.value);
    if(!nome){ toast("Scrivi che pezzo è."); f.nome.focus(); return; }
    if(isNaN(p) || p < 0){ toast("Scrivi il prezzo con un numero, per esempio 2,50."); f.prezzo.focus(); return; }
    s.ricambi.push({rid:null, nome, prezzo:r2(p), qta:1, origine:null, recupero:true}); toccaScheda(s); render();
  },
  eduPin: f => { if(f.pin.value === String(D.impostazioni.pin)){ ui.edu = true; ui.modale = null; ui.eduTab = "officine"; vai("edu"); } else { ui.modale = {tipo:"pin", err:true}; render(); } },
  salvaImpostazioni: f => {
    const I = D.impostazioni; const t = leggiNumero(f.tariffa.value); const iv = leggiNumero(f.ivaPct.value);
    if(isNaN(t) || t < 0){ toast("Scrivi la tariffa con un numero."); f.tariffa.focus(); return; }
    I.tariffa = r2(t); I.iva = f.iva.checked; I.ivaPct = isNaN(iv) ? 22 : iv; I.sconti = f.sconti.checked; I.contoComputer = f.contoComputer.checked;
    I.lingua2 = f.lingua2.value; I.nomeAttivita = f.nomeAttivita.value.trim();
    if(f.pin.value.trim()) I.pin = f.pin.value.trim();
    salva(); render(); toast("Impostazioni salvate.");
  },
  inviaImprevisto: f => {
    const o = D.officine.find(x => x.id === f.dataset.id); const sc = f.scelta.value;
    const testo = sc === "libero" ? f.testo.value.trim() : IMPREVISTI[+sc];
    if(!testo){ toast("Scrivi il testo dell'imprevisto."); f.testo.focus(); return; }
    o.imprevisti.forEach(i => { if(!i.risolto) i.risolto = new Date().toISOString(); });
    o.imprevisti.push({id:uid(), testo, inviato:new Date().toISOString(), risolto:null, risposta:""});
    ui.modale = null; salva(); render(); toast("Imprevisto mandato a «" + o.nome + "».");
  },
  salvaRisolto: f => { const o = off(); const imp = o.imprevisti.find(i => i.id === f.dataset.id); if(imp){ imp.risolto = new Date().toISOString(); imp.risposta = f.testo.value.trim(); } ui.modale = null; salva(); render(); toast("Bravi! Imprevisto risolto."); }
};

/* ---------------- CAMPI (scrittura) ---------------- */
const IN = {
  fotoNota: el => { const f = fotoAperta(); if(f){ f.nota = el.value; salva(); } },
  cercaCli: el => { ui.cercaCli = el.value; render(); },
  cercaC: el => { ui.cercaC = el.value; render(); },
  cercaS: el => { ui.cercaS = el.value; render(); },
  bici: el => { const s = trovaScheda(ui.schedaId); s.bici[el.dataset.k] = el.value; toccaScheda(s); },
  richiesta: el => { const s = trovaScheda(ui.schedaId); s.richiesta = el.value; toccaScheda(s); },
  risposta: el => { const s = trovaScheda(ui.schedaId); s.conto.risp[el.dataset.k] = el.value; salva(); },
  consegna: el => { const s = trovaScheda(ui.schedaId); s.consegna = el.value; toccaScheda(s); },
  noteScheda: el => { const s = trovaScheda(ui.schedaId); s.note = el.value; toccaScheda(s); },
  listinoNome: el => { const x = D.listino.find(r => r.id === el.dataset.id); if(x){ x.nome = el.value; salva(); } },
  listinoPrezzo: el => { const x = D.listino.find(r => r.id === el.dataset.id); const p = leggiNumero(el.value); if(x && !isNaN(p) && p >= 0){ x.prezzo = r2(p); salva(); } }
};
const CH = {
  fotoParte: el => { const f = fotoAperta(); if(f){ f.parte = el.value; salva(); } },
  fotoScelte: el => { const files = [...(el.files || [])]; if(files.length && ui.fotoDest) aggiungiFoto(files, ui.fotoDest); },
  sconto: el => { const s = trovaScheda(ui.schedaId); s.scontoPct = +el.value; toccaScheda(s); ui.focus = "sel-sconto"; render(); },
  prefToggle: el => { P[el.dataset.k] = el.checked; salvaPref(); render(); },
  fileImport: el => { const f = el.files && el.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => importa(String(r.result)); r.onerror = () => toast("Non riesco a leggere il file."); r.readAsText(f); }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const f = A[el.dataset.act]; if(!f) return;
  if(el.tagName === "BUTTON" && el.type !== "submit") e.preventDefault();
  f(el, e);
});
document.addEventListener("submit", e => { const f = e.target.closest("form[data-submit]"); if(!f) return; e.preventDefault(); const fn = S[f.dataset.submit]; if(fn) fn(f); });
document.addEventListener("input", e => { const el = e.target.closest("[data-in]"); if(el && IN[el.dataset.in]) IN[el.dataset.in](el); });
document.addEventListener("change", e => { const el = e.target.closest("[data-ch]"); if(el && CH[el.dataset.ch]) CH[el.dataset.ch](el); });
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && $("#camera")){ chiudiCamera(); render(); return; }
  if(e.key === "Escape" && ui.modale){ ui.modale = null; render(); return; }
  if(ui.modale && ui.modale.tipo === "foto" && (e.key === "ArrowLeft" || e.key === "ArrowRight") && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){
    const s = trovaScheda(ui.modale.sid); if(!s || s.foto.length < 2) return;
    const i = s.foto.findIndex(f => f.id === ui.modale.fid); const d = e.key === "ArrowLeft" ? -1 : 1;
    ui.modale.fid = s.foto[(i + d + s.foto.length) % s.foto.length].id; render();
  }
});
window.addEventListener("afterprint", () => { $("#stampa").innerHTML = ""; });

carica(); applicaPref(); render();
</script>
</body>
</html>
