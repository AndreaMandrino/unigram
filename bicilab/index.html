<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BiciLab – Officina bici</title>
<style>
:root{
  --carta:#FBF6EC; --pannello:#FFFDF8; --pannello-2:#F3EBDD; --linea:#DDD1BC; --linea-forte:#A39680;
  --ink:#23211E; --ink-2:#4F4943; --arancio:#C2410C; --arancio-scuro:#9A3412; --arancio-chiaro:#FCE9DD;
  --petrolio:#1F4E5F; --petrolio-chiaro:#E2EEF1; --ok:#2E7D32; --ok-chiaro:#E4F2E5; --ko:#B42318; --ko-chiaro:#FBE8E6;
  --giallo-chiaro:#FFF3C8; --scuro:#2A2622;
  --font: Verdana, "DejaVu Sans", "Noto Sans", Tahoma, "Segoe UI", Arial, sans-serif;
}
html[data-sfondo="giallo"]{--carta:#FFF7D1}
html[data-sfondo="azzurro"]{--carta:#EAF3F8}
html[data-sfondo="bianco"]{--carta:#FFFFFF}
html{font-size:18px}
html.t-grande{font-size:20px}
html.t-mgrande{font-size:23px}
*{box-sizing:border-box}
body{margin:0;background:var(--carta);color:var(--ink);font-family:var(--font);line-height:1.6;-webkit-text-size-adjust:100%}
body.spazio{letter-spacing:.05em;word-spacing:.18em;line-height:1.85}
body.maiuscolo, body.maiuscolo input, body.maiuscolo textarea, body.maiuscolo select{text-transform:uppercase}
em,i{font-style:normal}
h1{font-size:1.55rem;line-height:1.3;margin:.2em 0 .35em}
h2{font-size:1.22rem;line-height:1.35;margin:1.5em 0 .6em;display:flex;align-items:center;gap:.45em;flex-wrap:wrap}
h3{font-size:1.05rem;margin:1.1em 0 .45em}
h4{font-size:1rem;margin:.3em 0}
p{margin:.35em 0 .8em;max-width:70ch}
button{font:inherit}
.ico{width:1.3em;height:1.3em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.25em}
.ico-xl{width:2.2em;height:2.2em}
:focus-visible{outline:4px solid #1F6FEB;outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- testata ---------- */
.testata{background:var(--scuro);color:#FFF6E8;background-image:radial-gradient(rgba(255,255,255,.08) 1.4px,transparent 1.6px);background-size:15px 15px}
.testata-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.marchio{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;background:none;border:0;color:inherit;cursor:pointer;padding:4px}
.marchio-ico{background:var(--arancio);border-radius:10px;width:2.4rem;height:2.4rem;display:grid;place-items:center;color:#fff}
.off-info{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.off-simbolo{width:2.3rem;height:2.3rem;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;flex:none;border:2px solid rgba(255,255,255,.6)}
.off-info b{display:block;line-height:1.25}
.livello{white-space:nowrap;display:inline-flex;align-items:center;gap:.35em;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#FFF6E8;border-radius:999px;padding:.1em .7em;font-size:.8rem;cursor:pointer;margin-top:2px}
.testata-azioni{display:flex;gap:6px;flex-wrap:wrap}
.btn-testa{display:inline-flex;align-items:center;gap:.4em;background:transparent;border:2px solid rgba(255,255,255,.4);color:#FFF6E8;border-radius:10px;padding:.35em .7em;cursor:pointer;font-weight:700;font-size:.85rem;min-height:2.6rem}
.btn-testa:hover{background:rgba(255,255,255,.1)}
.testata :focus-visible{outline-color:#FFD54A}
.fascia-edu{background:var(--giallo-chiaro);border-bottom:2px solid #C9A227}
.fascia-edu-in{max-width:1120px;margin:0 auto;padding:8px 16px;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;font-weight:700}

/* ---------- navigazione ---------- */
.nav{background:var(--scuro)}
.nav-in{max-width:1120px;margin:0 auto;display:flex;gap:4px;padding:0 16px}
.nav button{display:flex;align-items:center;gap:.45em;padding:.65em 1em;background:none;border:0;color:#F3E9DA;font-weight:700;border-radius:12px 12px 0 0;cursor:pointer;font-size:.92rem}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-current="page"]{background:var(--carta);color:var(--ink)}
.nav .nav-nuova{color:#fff;background:var(--arancio);border-radius:10px;margin:5px 0;padding:.45em .9em}
.nav .nav-nuova:hover{background:var(--arancio-scuro)}
.nav :focus-visible{outline-color:#FFD54A}

/* ---------- impaginazione ---------- */
.contenitore{max-width:1120px;margin:0 auto;padding:18px 16px 110px}
.sotto{color:var(--ink-2)}
.nota{color:var(--ink-2);font-size:.9rem}
.vuoto{background:var(--pannello);border:2px dashed var(--linea-forte);border-radius:12px;padding:16px;color:var(--ink-2)}
.carta{background:var(--pannello);border:2px solid var(--linea);border-radius:14px;padding:14px 18px;box-shadow:0 3px 0 var(--linea);margin:12px 0}
.azioni-riga{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.due-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.due-col{grid-template-columns:1fr}}

/* ---------- pulsanti ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:3rem;padding:.5em 1.05em;border-radius:12px;border:2px solid var(--ink);background:var(--pannello);color:var(--ink);font-weight:700;cursor:pointer;text-align:center;line-height:1.25;text-decoration:none}
.btn:hover{background:var(--pannello-2)}
.btn-primario{background:var(--arancio);border-color:var(--arancio);color:#fff}
.btn-primario:hover{background:var(--arancio-scuro);border-color:var(--arancio-scuro)}
.btn-grande{min-height:3.5rem;font-size:1.08rem;padding:.55em 1.35em}
.btn-enorme{min-height:4.4rem;font-size:1.25rem;padding:.6em 1.8em;border-radius:16px}
.btn-pericolo{border-color:var(--ko);color:var(--ko)}
.btn-pericolo:hover{background:var(--ko-chiaro)}
.btn-piccolo{min-height:2.5rem;padding:.3em .8em;font-size:.9rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--petrolio);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:.3em}
.link.pericolo{color:var(--ko)}
.btn-voce{display:inline-flex;align-items:center;gap:.3em;border:2px solid var(--petrolio);color:var(--petrolio);background:var(--petrolio-chiaro);border-radius:999px;padding:.1em .7em;font-size:.8rem;font-weight:700;cursor:pointer;vertical-align:middle;min-height:2.1rem}
.btn-voce .ico{width:1.1em;height:1.1em}

/* ---------- campi ---------- */
.etichetta{display:block;font-weight:700;margin:.9em 0 .3em}
.campo{width:100%;min-height:3rem;padding:.5em .8em;border:2px solid var(--linea-forte);border-radius:10px;background:#fff;font:inherit;color:var(--ink)}
.campo:focus{border-color:var(--petrolio)}
textarea.campo{min-height:6rem;resize:vertical}
select.campo{appearance:auto}
.aiuto{font-size:.85rem;color:var(--ink-2);margin:.25em 0 0}
.errore{color:var(--ko);font-weight:700;margin:.3em 0}
.msg-passo{background:var(--ko-chiaro);border:2px solid var(--ko);border-radius:12px;padding:.7em 1em;font-weight:700;display:flex;gap:.5em;align-items:center}
fieldset{border:0;padding:0;margin:1em 0}
legend{font-weight:700;margin-bottom:.4em;padding:0}

/* ---------- chips e scelte ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:2.8rem;padding:.35em .9em;border:2px solid var(--linea-forte);border-radius:999px;background:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:.45em;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--arancio);background:var(--arancio-chiaro);font-weight:700;box-shadow:inset 0 0 0 2px var(--arancio)}
.campione{width:1.15em;height:1.15em;border-radius:50%;border:2px solid rgba(0,0,0,.35);flex:none}
.lista-scelta{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:12px 0}
.scelta{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border:2px solid var(--linea-forte);border-radius:12px;background:var(--pannello);cursor:pointer;color:var(--ink);min-height:3.6rem}
.scelta small{display:block;color:var(--ink-2)}
.scelta span{flex:1}
.scelta.scelto{border-color:var(--arancio);background:var(--arancio-chiaro);box-shadow:inset 0 0 0 2px var(--arancio)}
.radio-card{position:relative}
.radio-card input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.radio-card span.rc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 14px;border:2px solid var(--linea-forte);border-radius:12px;background:#fff;min-width:5.5rem;font-size:.85rem;font-weight:700}
.radio-card input:checked + span.rc{border-color:var(--arancio);background:var(--arancio-chiaro);box-shadow:inset 0 0 0 2px var(--arancio)}
.radio-card input:focus-visible + span.rc{outline:4px solid #1F6FEB;outline-offset:2px}
.radio-card .tondo{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--c)}

/* ---------- officine ---------- */
.benvenuto{padding:18px 0 4px}
.benvenuto h1{font-size:2.1rem;display:flex;align-items:center;gap:.4em}
.griglia-off{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card-off{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border:2px solid var(--linea-forte);border-radius:16px;background:var(--pannello);cursor:pointer;color:var(--ink);box-shadow:0 4px 0 var(--linea)}
.card-off:hover{border-color:var(--ink)}
.card-off .tondo{width:3.2rem;height:3.2rem;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--c);flex:none}
.card-off .tondo .ico{width:1.7em;height:1.7em}
.card-off b{font-size:1.1rem;display:block}
.card-off small{display:block;color:var(--ink-2)}

/* ---------- cartellini (schede) ---------- */
.lista-cart{display:grid;gap:10px}
.cartellino{display:grid;grid-template-columns:7.2em 1fr auto;gap:2px 14px;align-items:center;width:100%;text-align:left;background:var(--pannello);border:2px solid var(--linea-forte);border-radius:12px;padding:12px 16px 12px 46px;position:relative;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--linea)}
.cartellino:hover{border-color:var(--ink)}
.cartellino::before{content:"";position:absolute;left:16px;top:50%;width:13px;height:13px;transform:translateY(-50%);border-radius:50%;background:var(--carta);border:2px solid var(--linea-forte)}
.cart-num{font-weight:700;font-size:.95rem}
.cart-main b{display:block}
.cart-main small{color:var(--ink-2);display:block}
.cart-dx{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.cart-tot{font-weight:700;font-size:.95rem}
@media (max-width:640px){.cartellino{grid-template-columns:1fr}.cart-dx{align-items:flex-start;text-align:left;flex-direction:row;flex-wrap:wrap}}
.stato{display:inline-flex;align-items:center;gap:.35em;padding:.12em .65em;border-radius:999px;font-size:.82rem;font-weight:700;border:2px solid currentColor;background:#fff;white-space:nowrap}
.stato .ico{width:1.05em;height:1.05em}
.stato[data-s="bozza"]{color:#57534E}
.stato[data-s="preventivo"]{color:#8A3B0C}
.stato[data-s="accettato"]{color:var(--petrolio)}
.stato[data-s="lavorazione"]{color:var(--arancio)}
.stato[data-s="pronta"]{color:var(--ok)}
.stato[data-s="consegnata"]{color:#14532D;background:var(--ok-chiaro)}

/* ---------- tessere e barre ---------- */
.tessere{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tessera{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border:2px solid var(--linea-forte);border-radius:14px;background:var(--pannello);cursor:pointer;text-align:left;color:var(--ink);box-shadow:0 3px 0 var(--linea)}
.tessera:hover{border-color:var(--ink)}
.tessera .ico{width:2em;height:2em;color:var(--arancio)}
.tessera b{font-size:1.05rem}
.tessera small{color:var(--ink-2)}
.azione-centrale{margin:20px 0 8px}
.barra{height:16px;border-radius:999px;background:var(--pannello-2);border:2px solid var(--linea-forte);overflow:hidden;max-width:520px}
.barra > span{display:block;height:100%;background:var(--ok)}
.imprevisto{display:flex;gap:14px;align-items:flex-start;background:var(--giallo-chiaro);border:3px solid #B7791F;border-radius:14px;padding:14px 16px;margin:14px 0}
.imprevisto .ico{width:2em;height:2em;color:#8A5A00}
.imprevisto p{margin:.2em 0 .6em}

/* ---------- procedura guidata ---------- */
.wiz-testa{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.stepper{list-style:none;display:flex;gap:4px;padding:0;margin:6px 0 10px}
.stepper li{flex:1;min-width:0}
.stepper .pe{width:100%;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--ink-2);padding:4px 2px;cursor:default}
.stepper button.pe{cursor:pointer}
.stepper .num{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;border:2px solid var(--linea-forte);background:var(--pannello);font-weight:700}
.stepper .fatto .num{background:var(--petrolio);border-color:var(--petrolio);color:#fff}
.stepper .attivo .num{background:var(--arancio);border-color:var(--arancio);color:#fff;transform:scale(1.12)}
.stepper .attivo{color:var(--ink);font-weight:700}
.stepper .lab{font-size:.78rem;text-align:center}
.passo-testo{font-weight:700;color:var(--ink-2);margin:0}
@media (max-width:640px){.stepper .lab{display:none}}
.passo{margin-top:6px}
.barra-azioni{position:sticky;bottom:0;display:flex;justify-content:space-between;gap:12px;padding:14px 0 16px;background:linear-gradient(rgba(0,0,0,0),var(--carta) 35%);margin-top:18px;z-index:5}
.barra-azioni .spazio-vuoto{flex:1}
.ctr-riga{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;padding:10px 0;border-bottom:2px dashed var(--linea)}
.ctr-nome{font-weight:700;display:flex;align-items:center;gap:.5em}
.ctr-btn{display:flex;gap:6px;flex-wrap:wrap}
.tg{min-height:2.8rem;padding:.35em .75em;border:2px solid var(--linea-forte);border-radius:10px;background:#fff;font-weight:700;display:inline-flex;align-items:center;gap:.35em;cursor:pointer;color:var(--ink)}
.tg[aria-pressed="true"].v-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.tg[aria-pressed="true"].v-ko{background:var(--ko);border-color:var(--ko);color:#fff}
.tg[aria-pressed="true"].v-na{background:#57534E;border-color:#57534E;color:#fff}
@media (max-width:700px){.ctr-riga{grid-template-columns:1fr}}
.contatore{display:inline-block;background:var(--petrolio-chiaro);color:var(--petrolio);border-radius:999px;padding:.15em .8em;font-weight:700;font-size:.9rem}
.lavori-griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.lavoro{border:2px solid var(--linea-forte);border-radius:12px;background:var(--pannello);padding:4px 4px 8px;display:flex;flex-direction:column}
.lavoro.scelto{border-color:var(--arancio);background:var(--arancio-chiaro);box-shadow:inset 0 0 0 2px var(--arancio)}
.lavoro.consigliato:not(.scelto){border-style:dashed;border-color:var(--arancio)}
.lav-toggle{display:flex;gap:12px;align-items:flex-start;width:100%;background:none;border:0;text-align:left;padding:10px;cursor:pointer;color:inherit}
.spunta{width:1.75rem;height:1.75rem;border:2px solid var(--ink);border-radius:7px;display:grid;place-items:center;flex:none;background:#fff;color:#fff}
.scelto .spunta{background:var(--arancio);border-color:var(--arancio)}
.lav-nome{font-weight:700;display:block}
.lav-info{color:var(--ink-2);font-size:.88rem;display:flex;align-items:center;gap:.3em;margin-top:2px}
.lav-materie{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px 4px 52px}
.minuti{display:flex;align-items:center;gap:8px;padding:6px 10px 0 10px;flex-wrap:wrap}
.minuti b{min-width:4.2em;text-align:center}
.tondo-btn{width:2.6rem;height:2.6rem;border-radius:50%;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.etichetta-cat{display:flex;align-items:center;gap:.45em;font-weight:700;margin:1.3em 0 .5em;font-size:1.05rem}
.etichetta-cat .ico{color:var(--arancio)}
.riepilogo-lav{position:sticky;bottom:calc(3.5rem + 44px);background:var(--petrolio);color:#fff;border-radius:12px;padding:.6em 1em;font-weight:700;display:inline-flex;gap:.6em;align-items:center;margin-top:14px;z-index:4}

/* ---------- materie ---------- */
.mat{display:inline-flex;align-items:center;justify-content:center;min-width:3.1em;padding:.08em .5em;border-radius:7px;background:var(--c);color:#fff;font-weight:700;font-size:.75rem;letter-spacing:.04em;line-height:1.6}
.studio{background:var(--pannello);border:2px solid var(--linea);border-left:10px solid var(--c);border-radius:12px;padding:12px 16px;margin:12px 0}
.studio header{display:flex;align-items:center;gap:.6em;flex-wrap:wrap;font-weight:700;color:var(--ink-2);font-size:.9rem}
.studio h4{margin:.35em 0 .3em;font-size:1.06rem}
.studio .prova{background:var(--pannello-2);border-radius:10px;padding:.55em .85em}
.studio .da-lavoro{font-size:.85rem;color:var(--ink-2);margin:0}
.parole{display:grid;gap:6px;margin:.6em 0;padding:0;list-style:none}
.parole li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:#fff;border:1px solid var(--linea);border-radius:10px;padding:.4em .7em}
.parole .it{min-width:9em}
.parole .tr{font-weight:700}
.quiz{border-top:2px dashed var(--linea);margin-top:12px;padding-top:10px}
.quiz-opz{display:grid;gap:8px;margin:.5em 0}
.opz{display:flex;align-items:center;gap:.6em;text-align:left;padding:.6em 1em;border:2px solid var(--linea-forte);border-radius:10px;background:#fff;cursor:pointer;min-height:3rem;color:var(--ink)}
.opz[disabled]{cursor:default}
.opz.giusta{border-color:var(--ok);background:var(--ok-chiaro);font-weight:700}
.opz.sbagliata{border-color:var(--ko);background:var(--ko-chiaro)}
.esito{display:flex;gap:.5em;align-items:flex-start;border-radius:10px;padding:.6em .9em;margin:.5em 0;font-weight:700}
.esito .ico{margin-top:.15em}
.esito-ok{background:var(--ok-chiaro);border:2px solid var(--ok);color:#1B4D1E}
.esito-ko{background:var(--ko-chiaro);border:2px solid var(--ko);color:#7A1810}
.esito-info{background:var(--petrolio-chiaro);border:2px solid var(--petrolio);color:var(--petrolio)}
.griglia-mat{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card-mat{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px 16px;border:2px solid var(--linea-forte);border-top:10px solid var(--c);border-radius:12px;background:var(--pannello);cursor:pointer;color:var(--ink)}
.card-mat:hover{border-color:var(--ink);border-top-color:var(--c)}
.card-mat b{font-size:1.05rem}
.card-mat small{color:var(--ink-2)}
.segno{display:inline-flex;align-items:center;gap:.3em;font-size:.85rem;font-weight:700}
.segno.si{color:var(--ok)}
.segno.no{color:var(--ink-2)}
.chips-mat{display:flex;flex-wrap:wrap;gap:6px;margin:.4em 0 .8em}

/* ---------- schede ---------- */
.scheda-testa{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;background:var(--pannello);border:2px solid var(--ink);border-radius:16px;padding:14px 18px 14px 52px;position:relative;margin:8px 0 12px}
.scheda-testa::before{content:"";position:absolute;left:18px;top:50%;width:16px;height:16px;transform:translateY(-50%);border-radius:50%;background:var(--carta);border:2px solid var(--ink)}
.scheda-testa h1{margin:0}
.scheda-testa p{margin:0;color:var(--ink-2)}
.etich{font-size:.8rem;font-weight:700;color:var(--ink-2);letter-spacing:.06em}
.tracker{list-style:none;display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:6px 0 4px}
.tracker li{display:flex;align-items:center;gap:.35em;font-size:.82rem;padding:.25em .7em;border-radius:999px;border:2px solid var(--linea);color:var(--ink-2);background:var(--pannello)}
.tracker li.fatto{border-color:var(--petrolio);color:var(--petrolio)}
.tracker li.ora{border-color:var(--arancio);background:var(--arancio);color:#fff;font-weight:700}
.tabs{display:flex;gap:6px;border-bottom:3px solid var(--ink);margin:18px 0 12px;flex-wrap:wrap}
.tab{border:2px solid var(--ink);border-bottom:0;background:var(--pannello-2);padding:.55em 1.1em;border-radius:12px 12px 0 0;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:.45em;color:var(--ink);margin-bottom:-3px}
.tab[aria-selected="true"]{background:var(--carta);border-bottom:3px solid var(--carta)}
.info-griglia{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.info-griglia .carta{margin:0}
.dl{margin:0}
.dl div{display:flex;gap:.6em;flex-wrap:wrap;padding:.15em 0}
.dl dt{color:var(--ink-2);min-width:6.5em}
.dl dd{margin:0;font-weight:700}
.lista-controllo{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px}
.lista-controllo li{display:flex;gap:.45em;align-items:center}
.v-ok-t{color:var(--ok)} .v-ko-t{color:var(--ko)} .v-na-t{color:#57534E}
.lavori-fatti{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.lavori-fatti li{display:flex;align-items:center;gap:12px;justify-content:space-between;background:#fff;border:2px solid var(--linea);border-radius:12px;padding:.5em .8em;flex-wrap:wrap}

/* ---------- conto ---------- */
.conto{border:2px solid var(--ink);border-radius:14px;background:#fff;padding:12px 16px}
.riga-conto{display:grid;grid-template-columns:1fr auto 7.2em;gap:10px;padding:.42em 0;border-bottom:1px dashed var(--linea-forte);align-items:baseline}
.riga-conto .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.riga-conto .mezzo{color:var(--ink-2);font-size:.9rem;text-align:right}
.riga-conto.tit{font-weight:700;border-bottom:2px solid var(--ink);color:var(--ink-2);font-size:.85rem;letter-spacing:.05em}
.riga-conto.totale{border-top:3px double var(--ink);border-bottom:0;font-size:1.18rem;margin-top:.3em}
@media (max-width:560px){.riga-conto{grid-template-columns:1fr 6.2em}.riga-conto .mezzo{grid-column:1;text-align:left}.riga-conto .val{grid-column:2;grid-row:1/3}}
.ricambio{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:#fff;border:2px solid var(--linea);border-radius:12px;padding:.5em .8em;margin:8px 0}
.ricambio .nome{flex:1;min-width:10em;font-weight:700}
.ricambio .qta{display:flex;align-items:center;gap:6px}
.ricambio .qta b{min-width:2em;text-align:center}
.conto-scelta{background:var(--giallo-chiaro);border:2px solid #C9A227;border-radius:12px;padding:12px 14px;margin-top:12px}
.correttore{margin-top:12px;border-top:2px dashed var(--linea-forte);padding-top:10px}
.campo-conto{padding:10px 12px;border-radius:12px;border:2px solid var(--linea);margin:8px 0;background:var(--pannello)}
.campo-conto.ok{border-color:var(--ok);background:var(--ok-chiaro)}
.campo-conto.ko{border-color:var(--ko);background:var(--ko-chiaro)}
.campo-conto label{font-weight:700;display:block;margin-bottom:.3em}
.input-euro{display:flex;align-items:center;gap:8px;max-width:16rem}
.input-euro input{text-align:right;font-weight:700}
.fb{margin-top:.4em;font-weight:700}
.fb .ico{vertical-align:-.25em}
.passaggi{background:#fff;border:2px solid var(--petrolio);border-radius:10px;padding:.5em .9em;margin:.5em 0 0;font-weight:400}
.passaggi li{margin:.2em 0}

/* ---------- percorso ---------- */
.percorso{list-style:none;padding:0;margin:14px 0}
.percorso li{position:relative;padding:0 0 24px 70px;min-height:56px}
.percorso li::before{content:"";position:absolute;left:25px;top:52px;bottom:0;width:4px;background:repeating-linear-gradient(var(--linea-forte) 0 8px,rgba(0,0,0,0) 8px 14px)}
.percorso li:last-child::before{display:none}
.tappa-ico{position:absolute;left:0;top:0;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--linea-forte);background:var(--pannello);font-weight:700;font-size:1.1rem}
.percorso .superata .tappa-ico{background:var(--ok);border-color:var(--ok);color:#fff}
.percorso .corrente .tappa-ico{background:var(--arancio);border-color:var(--arancio);color:#fff}
.percorso .bloccata{color:var(--ink-2)}
.percorso h3{margin:.2em 0 .1em}
.percorso p{margin:.1em 0}

/* ---------- area educatore ---------- */
.edu-off{display:grid;gap:12px}
.edu-card{background:var(--pannello);border:2px solid var(--linea-forte);border-radius:14px;padding:14px 16px}
.edu-card header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.edu-card .tondo{width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--c)}
.edu-stat{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0;font-size:.92rem}
.listino-ed{display:grid;grid-template-columns:1fr 8em auto;gap:8px;align-items:center;margin:6px 0}
@media (max-width:560px){.listino-ed{grid-template-columns:1fr 6.5em auto}}
.riga-listino{display:flex;justify-content:space-between;gap:10px;padding:.5em 0;border-bottom:1px dashed var(--linea-forte)}
.riga-listino b{font-variant-numeric:tabular-nums}
.interruttore{display:flex;align-items:center;gap:.7em;font-weight:700;margin:.7em 0;cursor:pointer}
.interruttore input{width:1.5rem;height:1.5rem;accent-color:var(--arancio)}

/* ---------- finestre e avvisi ---------- */
.velo{position:fixed;inset:0;background:rgba(35,33,30,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;z-index:50;overflow:auto}
.finestra{background:var(--carta);border-radius:16px;max-width:640px;width:100%;padding:18px 22px 20px;border:3px solid var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.3)}
.finestra h2{margin-top:.2em}
.finestra textarea.esporta{width:100%;min-height:10rem;font-family:monospace;font-size:.75rem}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--scuro);color:#fff;padding:.8em 1.2em;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:min(92vw,560px);z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);text-align:center}
.toast.vis{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:759px){
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:20;border-top:3px solid var(--arancio)}
  .nav-in{padding:0;gap:0}
  .nav button{flex-direction:column;gap:2px;font-size:.68rem;padding:7px 2px 9px;border-radius:0;flex:1;line-height:1.2}
  .nav button[aria-current="page"]{background:#433C35;color:#fff}
  .nav .nav-nuova{margin:0;border-radius:0}
  .nav .solo-largo{display:none}
  .btn-testa span{display:none}
  .testata-azioni{margin-left:auto}
  .off-info{order:3;flex-basis:100%}
  .tabs{border-bottom:0;gap:8px}
  .tab{flex:1 1 100%;border-radius:12px;border-bottom:2px solid var(--ink);margin:0}
  .tab[aria-selected="true"]{background:var(--ink);color:#fff;border-bottom:2px solid var(--ink)}
  .tracker li:not(.ora) .tr-t{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .tracker li{padding:.25em .5em}
  .btn-testa{padding:.35em .55em}
  .testata-in{gap:8px}
  h1{font-size:1.35rem}
  .benvenuto h1{font-size:1.7rem}
  .btn-enorme{width:100%}
}

/* =========================================================
   ASPETTO E MOVIMENTO
   ========================================================= */
#sfondo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background-image:radial-gradient(rgba(35,33,30,.075) 1.3px,rgba(0,0,0,0) 1.6px);background-size:22px 22px}
#sfondo.vuoto{background:none}
#sfondo::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 56% 64% at 50% 46%,var(--carta) 42%,rgba(255,255,255,0) 100%)}
#app,#modale{position:relative;z-index:1}
.deco{position:absolute;color:var(--ink);opacity:.12;
  transform:translate(calc(var(--mx,0) * var(--z) * -1px),calc(var(--my,0) * var(--z) * -1px));transition:transform .7s cubic-bezier(.2,.8,.3,1)}
.deco.acc{color:var(--c-off,#C2410C);opacity:.2}
.deco svg{display:block;width:100%;height:100%;overflow:visible}
.deco svg *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.deco .scorri{transform-box:fill-box;transform-origin:center;transform:rotate(calc(var(--sy,0) * var(--k,.06) * 1deg));transition:transform .5s ease-out}
.deco .gira,.d-gira{transform-box:fill-box;transform-origin:center;animation:gira var(--t,90s) linear infinite}
.deco .gira.inv,.d-gira.inv{animation-direction:reverse}
.deco .maglie{stroke-width:4;stroke-dasharray:7 5;animation:maglie 1.8s linear infinite}
.deco .galleggia{animation:galleggia 7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.deco .sottile *{stroke-width:1.1}
.deco.entra{animation:decoEntra 1.4s cubic-bezier(.2,.8,.3,1) backwards}
.deco.entra:nth-child(2){animation-delay:.12s}.deco.entra:nth-child(3){animation-delay:.24s}.deco.entra:nth-child(4){animation-delay:.36s}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes maglie{to{stroke-dashoffset:-12}}
@keyframes galleggia{from{transform:translateY(-6px) rotate(-6deg)}to{transform:translateY(8px) rotate(5deg)}}
@keyframes decoEntra{from{opacity:0;scale:.7}}
@media (max-width:760px){.deco{scale:.6}.deco.acc{opacity:.16}}

/* ---------- copertina (banco di lavoro e pagina iniziale) ---------- */
.eroe{position:relative;display:grid;grid-template-columns:1.15fr 1fr;gap:6px 26px;align-items:center;color:#FFF6E8;
  background:#2A2622 radial-gradient(rgba(255,255,255,.07) 1.4px,rgba(0,0,0,0) 1.6px) 0 0/15px 15px;
  border-radius:24px;padding:26px 30px;margin:8px 0 22px;overflow:hidden;
  box-shadow:0 6px 0 #171411,0 22px 40px -22px rgba(0,0,0,.55);
  --telaio:#F4A261;--telaio:color-mix(in srgb,var(--c) 50%,#FFE3C8)}
.eroe::before{content:"";position:absolute;right:-12%;bottom:-45%;width:70%;height:130%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(244,162,97,.35),rgba(0,0,0,0));background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 55%,transparent),rgba(0,0,0,0))}
.eroe-testo{position:relative}
.eroe h1{color:#fff;font-size:2.05rem;margin:.25em 0 .2em}
.eroe p{color:#EFE4D3;margin:.2em 0 .9em}
.eroe-etich{display:inline-flex;gap:.45em;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);padding:.18em .8em;border-radius:999px;font-size:.8rem;font-weight:700;color:#FFE7C9}
.eroe-stat{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.eroe-stat span{display:inline-flex;align-items:center;gap:.35em;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:.3em .8em;font-size:.85rem}
.eroe-stat b{font-size:1.05rem;color:#fff}
.eroe-disegno{position:relative}
.eroe .btn-voce{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.55)}
.eroe :focus-visible{outline-color:#FFD54A}
.eroe-casa h1{font-size:2.6rem}
@media (max-width:760px){.eroe{grid-template-columns:1fr;padding:18px 18px 20px;border-radius:20px}.eroe-disegno{order:-1;max-width:330px;width:100%;margin:-6px auto 0}.eroe h1,.eroe-casa h1{font-size:1.6rem}}
.disegno{display:block;width:100%;height:auto}
.disegno *{fill:none;stroke-linecap:round;stroke-linejoin:round}
.d-linea{stroke:#A89C8A;stroke-width:2}
.d-terra{stroke:#6B6157;stroke-width:3}
.d-ombra{fill:rgba(0,0,0,.3)!important;stroke:none}
.d-cavalletto{stroke:#8E8475;stroke-width:5}
.d-gomma{stroke:#F3E9DA;stroke-width:6}
.d-cerchio{stroke:#A89C8A;stroke-width:2}
.d-raggi line{stroke:#D8CDBB;stroke-width:1}
.d-mozzo{stroke:#F3E9DA;stroke-width:3}
.d-telaio{stroke:var(--telaio);stroke-width:6}
.d-chiaro{stroke:#F3E9DA;stroke-width:5}
.d-corona{stroke:#F6C445;stroke-width:3;stroke-dasharray:3 2}
.d-pedivella{stroke:#F3E9DA;stroke-width:4}
.d-pedale{stroke:#F6C445;stroke-width:5}
.d-catena{stroke:#BDB19E;stroke-width:2.5;stroke-dasharray:3 2;animation:catenaH 1.2s linear infinite}
.d-attrezzo{stroke:#D8CDBB;stroke-width:1.6}
.d-gancio{stroke:#8E8475;stroke-width:2}
.d-oscilla{transform-box:view-box;animation:oscilla 3.6s ease-in-out infinite alternate}
.d-oscilla.lento{animation-duration:5s;animation-delay:-1.5s}
@keyframes catenaH{to{stroke-dashoffset:5}}
@keyframes oscilla{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}

/* ---------- pulsanti reattivi ---------- */
.btn{position:relative;overflow:hidden;--ombra-btn:#9C8F7C;box-shadow:0 4px 0 var(--ombra-btn);
  transition:transform .13s ease,box-shadow .13s ease,background-color .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ombra-btn)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ombra-btn);transition-duration:.05s}
.btn-primario{--ombra-btn:#7C2D12}
.btn-pericolo{--ombra-btn:#E8B4AE}
.btn[disabled],.btn[disabled]:hover{transform:none;box-shadow:none}
.btn-primario::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.38),rgba(255,255,255,0));transform:skewX(-18deg);transition:left .55s ease}
.btn-primario:hover::after{left:125%}
.brilla::after{animation:luccica 2.4s ease-in-out 1.2s 2}
@keyframes luccica{0%{left:-70%}45%,100%{left:125%}}
.btn .ico{transition:transform .18s ease}
.btn:hover .ico{transform:scale(1.15) rotate(-6deg)}
.btn-testa{transition:transform .12s,background-color .15s}
.btn-testa:active,.livello:active,.marchio:active{transform:scale(.94)}
.marchio:hover .marchio-ico{animation:sobbalza .5s ease}
@keyframes sobbalza{30%{transform:translateY(-3px) rotate(-8deg)}60%{transform:translateY(1px) rotate(4deg)}}
.chip,.tg,.scelta,.opz,.tondo-btn,.tab,.btn-voce,.radio-card span.rc,.lav-toggle .spunta{transition:transform .12s ease,box-shadow .15s,background-color .15s,border-color .15s}
.chip:hover,.tg:hover,.scelta:hover,.opz:not([disabled]):hover{transform:translateY(-2px);border-color:var(--ink);box-shadow:0 3px 0 var(--linea)}
.chip:active,.tg:active,.scelta:active,.opz:not([disabled]):active,.tondo-btn:active,.btn-voce:active,.radio-card:active span.rc{transform:scale(.94);box-shadow:none}
.tondo-btn:hover{background:var(--pannello-2)}
.tondo-btn:active .ico{transform:rotate(90deg)}
.tondo-btn .ico{transition:transform .2s}
.lav-toggle:active .spunta{transform:scale(.82)}
.lavoro{transition:transform .15s ease,box-shadow .15s ease}
.lavoro:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--linea)}
.tessera,.card-off,.card-mat{transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
.tessera:hover,.card-off:hover,.card-mat:hover{transform:translateY(-4px);box-shadow:0 8px 0 var(--linea)}
.tessera:active,.card-off:active,.card-mat:active{transform:translateY(2px);box-shadow:0 1px 0 var(--linea)}
.tessera .tile{display:grid;place-items:center;width:3.2rem;height:3.2rem;border-radius:14px;background:var(--arancio-chiaro);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tessera .tile .ico{width:1.8em;height:1.8em}
.tessera:hover .tile{transform:rotate(-8deg) scale(1.08)}
.card-off{border-top:8px solid var(--c)}
.card-off .tondo{background:var(--c)}
.card-off:hover .tondo .ico{animation:gira 1s cubic-bezier(.3,.8,.4,1)}
.cartellino{transform-origin:22px 50%;transition:box-shadow .15s,border-color .15s}
.cartellino:hover{animation:dondola .8s ease-in-out}
.cartellino:active{transform:scale(.99)}
.cartellino > .cart-num::before{content:"";position:absolute;left:-14px;top:calc(50% - 30px);width:37px;height:30px;border:2px solid var(--linea-forte);border-left:0;border-bottom:0;border-radius:0 30px 0 0;pointer-events:none}
@keyframes dondola{0%{transform:rotate(0)}30%{transform:rotate(-1.6deg)}62%{transform:rotate(.9deg)}100%{transform:rotate(0)}}
.barra > span{background:repeating-linear-gradient(45deg,rgba(255,255,255,.2) 0 8px,rgba(255,255,255,0) 8px 16px),var(--ok)}
.barra > span.riempi{animation:riempi 1s cubic-bezier(.3,1.2,.5,1) .15s backwards}
@keyframes riempi{from{width:var(--da)}}
.livello{background:linear-gradient(100deg,rgba(255,255,255,.1) 40%,rgba(255,255,255,.3) 50%,rgba(255,255,255,.1) 60%) 0 0/250% 100%;animation:riflesso 6s linear infinite}
@keyframes riflesso{from{background-position:120% 0}to{background-position:-120% 0}}

/* ---------- risposte dei controlli ---------- */
.pop{animation:pop .34s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.88)}55%{transform:scale(1.06)}100%{transform:scale(1)}}
.pop .spunta .ico,.pop.tg .ico,.pop .opz .ico,.opz.pop .ico,.pop > .ico{stroke-dasharray:60;stroke-dashoffset:60;animation:traccia .5s .06s ease-out forwards}
@keyframes traccia{to{stroke-dashoffset:0}}
.scuoti{animation:scuoti .42s ease}
@keyframes scuoti{0%,100%{transform:translateX(0)}18%{transform:translateX(-8px)}36%{transform:translateX(7px)}54%{transform:translateX(-5px)}72%{transform:translateX(3px)}}
.campo-conto.ok .fb .ico,.esito-ok > .ico{stroke-dasharray:60;stroke-dashoffset:60;animation:traccia .6s .1s ease-out forwards}

/* ---------- passi e passaggi di pagina ---------- */
.t-su{animation:entraSu .34s ease-out}
.t-dx{animation:entraDx .32s ease-out}
.t-sx{animation:entraSx .32s ease-out}
.t-su .tessere > *,.t-su .lista-cart > *,.t-su .griglia-mat > *,.t-su .griglia-off > *,.t-su .edu-off > *,.t-su .percorso > li{animation:entraSu .45s ease-out backwards}
.t-su .tessere > :nth-child(2),.t-su .lista-cart > :nth-child(2),.t-su .griglia-mat > :nth-child(2),.t-su .griglia-off > :nth-child(2),.t-su .percorso > li:nth-child(2){animation-delay:.05s}
.t-su .tessere > :nth-child(3),.t-su .lista-cart > :nth-child(3),.t-su .griglia-mat > :nth-child(3),.t-su .griglia-off > :nth-child(3),.t-su .percorso > li:nth-child(3){animation-delay:.1s}
.t-su .tessere > :nth-child(4),.t-su .lista-cart > :nth-child(4),.t-su .griglia-mat > :nth-child(4),.t-su .percorso > li:nth-child(4){animation-delay:.15s}
.t-su .tessere > :nth-child(5),.t-su .griglia-mat > :nth-child(n+5),.t-su .percorso > li:nth-child(n+5){animation-delay:.2s}
.t-pannello{animation:entraSu .28s ease-out}
@keyframes entraSu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes entraDx{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes entraSx{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.nav-anima button[aria-current="page"] .ico{animation:sobbalza .5s ease}
.stepper li{position:relative}
.stepper li + li::before{content:"";position:absolute;top:calc(4px + 1.1rem - 2px);left:-50%;width:100%;height:4px;border-radius:2px;background:var(--linea);z-index:0}
.stepper li.fatto::before{background:var(--petrolio)}
.stepper li.attivo::before{background:linear-gradient(var(--petrolio),var(--petrolio)) left/100% 100% no-repeat var(--linea)}
.t-dx .stepper li.attivo::before{animation:linea .6s ease-out}
@keyframes linea{from{background-size:0 100%}}
.stepper .num{position:relative;z-index:1}
.stepper .attivo .num{animation:pulsa 2.2s ease-out 3}
@keyframes pulsa{0%{box-shadow:0 0 0 0 rgba(194,65,12,.5)}70%,100%{box-shadow:0 0 0 12px rgba(194,65,12,0)}}

/* ---------- onde, coriandoli, festa ---------- */
#effetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.onda{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:3px solid var(--c,#C2410C);animation:onda .55s ease-out forwards}
@keyframes onda{from{transform:scale(.4);opacity:.75}to{transform:scale(5.5);opacity:0}}
.coriandolo{position:absolute;width:9px;height:9px;margin:-4px 0 0 -4px;border-radius:2px;background:var(--c);animation:scoppio .9s cubic-bezier(.15,.7,.35,1) forwards}
.coriandolo.tondo{border-radius:50%}
@keyframes scoppio{0%{transform:translate(0,0) rotate(0);opacity:1}75%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.festa{position:absolute;left:50%;top:38%;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:270px;max-width:90vw;text-align:center;
  background:var(--scuro);color:#fff;border:3px solid #F6C445;border-radius:22px;padding:18px 28px 20px;box-shadow:0 20px 50px rgba(0,0,0,.35);
  animation:festa 2.6s ease forwards}
.festa .ico{width:3.2rem;height:3.2rem;color:#F6C445;animation:medaglia .9s cubic-bezier(.3,1.6,.5,1)}
.festa b{font-size:1.2rem}
.festa span{color:#EFE4D3}
@keyframes festa{0%{opacity:0;transform:translate(-50%,-40%) scale(.8)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}82%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-58%) scale(.97)}}
@keyframes medaglia{0%{transform:scale(.2) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.toast{transition:opacity .25s,transform .35s cubic-bezier(.2,1.5,.4,1)}

/* ---------- senza movimento ---------- */
html.fermo *,html.fermo *::before,html.fermo *::after{animation:none!important;transition:none!important}
html.fermo .btn:hover,html.fermo .chip:hover,html.fermo .tessera:hover,html.fermo .card-off:hover,html.fermo .card-mat:hover,html.fermo .lavoro:hover,html.fermo .scelta:hover,html.fermo .opz:hover,html.fermo .tg:hover{transform:none}

/* ---------- foto ---------- */
.foto-griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:10px 0}
.foto-griglia.piccola{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));margin:0;flex:1 1 100%}
.foto{position:relative;display:block;width:100%;padding:0;border:2px solid var(--linea-forte);border-radius:12px;overflow:hidden;background:var(--pannello-2);aspect-ratio:4/3;cursor:zoom-in;transition:transform .15s,box-shadow .15s}
.foto:hover{transform:translateY(-2px) rotate(-.6deg);box-shadow:0 5px 0 var(--linea)}
.foto:active{transform:scale(.97)}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto-etich{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(35,33,30,.8);color:#fff;font-size:.72rem;font-weight:700;border-radius:8px;padding:.1em .5em;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foto.mancante::before{content:"Foto non trovata";position:absolute;inset:0;display:grid;place-items:center;font-size:.8rem;color:var(--ink-2)}
.ctr-foto{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--ko-chiaro);border:2px dashed var(--ko);border-radius:12px;padding:8px 10px}
.vis-foto{margin:0 0 10px;background:#1B1916;border-radius:14px;padding:6px;min-height:120px;display:grid;place-items:center}
.vis-foto img{display:block;max-width:100%;max-height:52vh;border-radius:10px}
.prima-dopo{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:6px 0 14px;max-width:640px}
.prima-dopo figure{margin:0}
.prima-dopo figcaption{font-weight:700;text-align:center;margin-top:4px}
.pd-freccia .ico{width:2em;height:2em;color:var(--arancio)}
.cart-main{display:flex;align-items:center;gap:12px;min-width:0}
.cart-foto{width:3.4rem;height:3.4rem;border-radius:10px;object-fit:cover;flex:none;border:2px solid var(--linea);background:var(--pannello-2)}
#camera{position:fixed;inset:0;z-index:90;background:rgba(20,18,16,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;color:#fff;text-align:center}
#camera video{width:min(96vw,880px);max-height:64vh;border-radius:16px;background:#000;object-fit:contain}
#camera .cam-msg{font-weight:700;max-width:40em;margin:0}
#camera .cam-conta{color:#F6C445;font-weight:700;min-height:1.6em;margin:0}
#camera :focus-visible{outline-color:#FFD54A}
.flash{position:fixed;inset:0;background:#fff;pointer-events:none;animation:flash .4s ease-out forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.st-foto{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.st-foto.st-pd{grid-template-columns:1fr 1fr}
.st-foto figure{margin:0;break-inside:avoid;page-break-inside:avoid}
.st-foto img{width:100%;height:36mm;object-fit:cover;border:1px solid #000;border-radius:4px;display:block}
.st-pd img{height:52mm}
.st-foto figcaption{font-size:8pt;margin-top:1px}

/* ---------- stampa ---------- */
#stampa{display:none}
.pagina{font-family:var(--font);color:#000;font-size:10.5pt;line-height:1.45}
.pagina h2{font-size:13pt;margin:0 0 4px;display:block}
.pagina h3{font-size:11pt;margin:0 0 4px;text-transform:uppercase;letter-spacing:.06em}
.st-testa{display:flex;justify-content:space-between;align-items:stretch;gap:12px;border-bottom:3px solid #000;padding-bottom:8px;margin-bottom:8px}
.st-off{font-weight:700;font-size:12pt}
.st-tit{font-size:15pt;font-weight:700;margin:2px 0}
.st-cart{border:2px dashed #000;border-radius:10px;padding:6px 12px 6px 30px;position:relative;min-width:62mm;font-size:9.5pt}
.st-cart .foro{position:absolute;left:9px;top:50%;width:11px;height:11px;border:2px solid #000;border-radius:50%;transform:translateY(-50%)}
.st-cart .forbici{font-size:8pt;display:flex;align-items:center;gap:4px}
.st-cart b{font-size:12pt;display:block}
.st-box{border:1.5px solid #000;border-radius:8px;padding:6px 10px;margin:7px 0;break-inside:avoid;page-break-inside:avoid}
.st-due{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st-due .st-box{margin:0}
.st-ctr{list-style:none;padding:0;margin:0;columns:2;column-gap:16px}
.st-ctr li{display:flex;gap:5px;align-items:center;break-inside:avoid}
.st-lav{margin:0;padding-left:18px}
.st-lav li{display:flex;justify-content:space-between;gap:10px}
.st-riga{display:grid;grid-template-columns:1fr 50mm 32mm;gap:6px;padding:2px 0;border-bottom:1px dotted #555}
.st-riga .v{text-align:right;font-weight:700;white-space:nowrap}
.st-riga .m{text-align:right}
.st-riga.tot{border-top:2px solid #000;border-bottom:0;font-size:12pt;margin-top:3px}
.st-vuoto{display:inline-block;min-width:22mm;border-bottom:1px solid #000;height:1em}
.st-firme{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.st-firme div{border-top:1px solid #000;padding-top:3px;font-size:9pt;margin-top:22px}
.st-piede{margin-top:10px;font-size:8pt;border-top:1px solid #000;padding-top:4px;display:flex;justify-content:space-between;gap:8px}
.st-item{border:1.5px solid #000;border-left:7px solid var(--c);border-radius:6px;padding:5px 9px;margin:6px 0;break-inside:avoid;page-break-inside:avoid}
.st-item .mat{font-size:7.5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.st-item p{margin:2px 0;max-width:none}
.st-opz{list-style:none;padding:0;margin:2px 0 0}
.st-opz li::before{content:"\2610  "}
.st-parole{columns:2;margin:3px 0;padding-left:16px}
.st-righe{border-bottom:1px solid #000;height:7mm}
.st-dom{margin:2px 0;padding-left:20px}
.st-dom li{margin:2px 0}
.pagina .ico{width:1.1em;height:1.1em}
@media print{
  @page{size:A4;margin:11mm}
  html,body{background:#fff!important;font-size:10.5pt}
  body > *:not(#stampa):not(#sprite){display:none!important}
  #stampa{display:block!important}
  .pagina{break-after:page;page-break-after:always}
  .pagina:last-child{break-after:auto;page-break-after:auto}
  .mat,.st-item{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

const LAVORI = [
{id:"foratura", cat:"ruote", nome:"Riparare una foratura", min:20, ricambi:["kit_toppe"], parole:["foratura","camera","toppa","pompa","valvola"], studio:[
 {m:"SCI", t:"L'aria spinge: la pressione", p:"La camera d'aria è piena d'aria. L'aria spinge in tutte le direzioni. Se c'è un buco, anche piccolo, l'aria esce e la gomma si sgonfia.", a:"Metti la camera d'aria gonfia in una bacinella d'acqua. Guarda dove escono le bolle: lì c'è il buco.", q:{d:"Perché metti la camera d'aria nell'acqua?", o:["Per vedere le bolle che escono dal buco","Per pulire la gomma","Per raffreddare l'aria"], i:"Pensa a che cosa fa l'aria quando esce sott'acqua."}},
 {m:"TEC", t:"La toppa e il mastice", p:"La toppa si attacca con il mastice. Prima bisogna grattare la gomma con la carta vetrata: la superficie diventa ruvida e pulita e la toppa si attacca meglio.", a:"Scrivi in ordine le fasi della riparazione: trova il buco, gratta, metti il mastice, aspetta, metti la toppa, premi forte.", q:{d:"Che cosa fai prima di mettere il mastice?", o:["Gratti la gomma con la carta vetrata","Gonfi la camera d'aria al massimo","Metti subito la toppa"], i:"La superficie deve essere ruvida e pulita."}},
 {m:"STO", t:"La gomma piena d'aria", p:"Nel 1888 lo scozzese John Boyd Dunlop, un veterinario, costruì e brevettò una gomma piena d'aria per il triciclo di suo figlio. Prima le ruote avevano gomma piena o ferro: si viaggiava con tanti scossoni.", a:"Metti il 1888 su una linea del tempo. Che cosa succedeva in Italia in quegli anni?", q:{d:"In che secolo Dunlop brevettò la gomma ad aria?", o:["Nell'Ottocento (XIX secolo)","Nel Novecento (XX secolo)","Nel Settecento (XVIII secolo)"], i:"Gli anni dal 1801 al 1900 formano l'Ottocento."}}
]},
{id:"camera", cat:"ruote", nome:"Sostituire la camera d'aria", min:15, ricambi:["camera"], parole:["camera","valvola","pompa","ruota"], studio:[
 {m:"MAT", t:"Pollici e centimetri", p:"La misura delle ruote spesso è in pollici. 1 pollice è uguale a 2,54 centimetri. La camera d'aria nuova deve avere la stessa misura della ruota.", a:"Leggi la misura scritta sulla gomma. Trasforma i pollici in centimetri: moltiplica per 2,54.", q:{d:"Una ruota da 26 pollici quanti centimetri misura, circa?", o:["Circa 66 cm","Circa 26 cm","Circa 10 cm"], i:"Fai 26 × 2,54. Puoi usare la calcolatrice."}},
 {m:"TEC", t:"Tre tipi di valvola", p:"Le valvole delle bici sono di tre tipi: americana (uguale a quella delle auto), francese (sottile, con un piccolo dado in cima) e italiana. La pompa deve avere la testina giusta per la valvola.", a:"Guarda la valvola della bici e scopri di che tipo è. Disegnala.", q:{d:"Quale valvola è uguale a quella delle auto?", o:["La valvola americana","La valvola francese","Nessuna valvola"], i:"Il suo nome ricorda un continente."}},
 {m:"CIV", t:"Una camera d'aria rotta non è un rifiuto", p:"Una camera d'aria si può riparare tante volte. Quando non si può più riparare, la gomma si può riusare: si fanno elastici, cinghie, portafogli e borse.", a:"Progettate un oggetto utile da fare con una camera d'aria vecchia. Disegnatelo e scrivete come si usa.", q:{d:"Che cosa fai prima di buttare una camera d'aria bucata?", o:["Provo a ripararla o a riusarla","La brucio","La lascio in strada"], i:"Pensa a riparare e riusare."}}
]},
{id:"copertone", cat:"ruote", nome:"Sostituire il copertone", min:20, ricambi:["copertone"], parole:["copertone","ruota","cerchio"], studio:[
 {m:"MAT", t:"Leggere la sigla della gomma", p:"Sul fianco del copertone c'è una sigla, per esempio 37-622. Il primo numero è la larghezza in millimetri. Il secondo numero è il diametro del cerchio in millimetri.", a:"Cerca la sigla su una gomma. Trasforma i millimetri in centimetri: dividi per 10.", q:{d:"Nella sigla 37-622, quanto è largo il copertone?", o:["3,7 cm","37 cm","62,2 cm"], i:"37 è in millimetri. 10 millimetri fanno 1 centimetro."}},
 {m:"SCI", t:"Attrito e aderenza", p:"Il disegno della gomma si chiama battistrada. Aiuta la ruota a non scivolare: è l'attrito tra gomma e strada. Una gomma liscia e consumata scivola di più, soprattutto sul bagnato.", a:"Tocca il battistrada di una gomma nuova e di una gomma consumata. Che differenza senti?", q:{d:"Perché una gomma consumata è pericolosa?", o:["Ha meno aderenza e scivola di più","Diventa più pesante","Fa andare più piano la catena"], i:"Pensa all'attrito tra la gomma e la strada bagnata."}},
 {m:"GEO", t:"Da dove viene la gomma", p:"La gomma naturale si fa con il lattice di un albero, l'Hevea. L'albero viene dalla foresta amazzonica, in America del Sud. Oggi si coltiva soprattutto nel Sud-Est asiatico, per esempio in Thailandia e in Indonesia. Nei copertoni c'è anche gomma sintetica, fatta con il petrolio.", a:"Trova sulla carta l'Amazzonia e la Thailandia. Quali mari attraversa una nave che porta la gomma dalla Thailandia all'Italia?", q:{d:"Da quale continente viene l'albero della gomma?", o:["America del Sud","Europa","Oceania"], i:"Pensa alla foresta amazzonica."}}
]},
{id:"pressione", cat:"ruote", nome:"Gonfiare le gomme alla pressione giusta", min:5, ricambi:[], parole:["pompa","valvola","copertone"], studio:[
 {m:"MAT", t:"Bar e PSI: due unità di misura", p:"La pressione delle gomme si misura in bar o in PSI. 1 bar è circa 14,5 PSI. Sul fianco della gomma c'è scritta la pressione minima e massima.", a:"Leggi sulla gomma la pressione massima. Se è in PSI, trasformala in bar: dividi per 14,5.", q:{d:"Una gomma ha scritto 58 PSI. Quanti bar sono, circa?", o:["4 bar","58 bar","0,4 bar"], i:"Dividi 58 per 14,5."}},
 {m:"SCI", t:"L'aria si può comprimere", p:"Con la pompa spingi tanta aria in poco spazio. L'aria si comprime e spinge forte contro la gomma. Per questo la gomma diventa dura.", a:"Tappa con un dito il buco della pompa e spingi piano. Senti l'aria che spinge contro il dito?", q:{d:"Che cosa fa l'aria quando la pompi nella gomma?", o:["Si comprime e spinge contro la gomma","Diventa acqua","Sparisce"], i:"Pensa alla pompa tappata con il dito."}},
 {m:"MOT", t:"Meno fatica a pedalare", p:"Con le gomme sgonfie la bici è più lenta e fai più fatica. Con la pressione giusta pedali meglio e ti stanchi meno.", a:"In cortile, con un adulto, fai un breve giro con le gomme poco gonfie e poi gonfie. Che cosa cambia nelle tue gambe?", q:{d:"Con le gomme sgonfie...", o:["fai più fatica a pedalare","vai più veloce","freni meglio"], i:"Pensa a quanta forza metti sui pedali."}}
]},
{id:"freni_reg", cat:"freni", nome:"Regolare i freni", min:15, ricambi:[], parole:["freno","leva","cavo"], studio:[
 {m:"TEC", t:"La leva del freno", p:"La leva del freno è una leva. Il perno su cui gira è il fulcro. La mano spinge lontano dal fulcro, il cavo è attaccato vicino al fulcro: così con poca forza tiri forte il cavo.", a:"Guarda la leva del freno. Indica il fulcro, il punto dove spinge la mano e il punto dove è attaccato il cavo.", q:{d:"Dov'è il fulcro nella leva del freno?", o:["Nel perno su cui gira la leva","Nella gomma della ruota","Nel campanello"], i:"Il fulcro è il punto fermo intorno a cui la leva gira."}},
 {m:"SCI", t:"L'attrito ferma la bici", p:"Il freno stringe il cerchio o il disco. L'attrito rallenta la ruota. L'energia del movimento diventa calore: dopo una lunga discesa il cerchio è caldo.", a:"Strofina forte le mani una contro l'altra per 10 secondi. Che cosa senti?", q:{d:"Quando freni, l'energia del movimento diventa soprattutto...", o:["calore","luce","elettricità"], i:"Pensa alle mani che strofini."}},
 {m:"CIV", t:"Due freni per legge", p:"Il Codice della strada dice che la bici deve avere due freni indipendenti: uno per la ruota davanti e uno per la ruota dietro.", a:"Controlla una bici: ha due freni che funzionano ognuno da solo? Prova prima uno e poi l'altro.", q:{d:"Quanti freni deve avere una bici per il Codice della strada?", o:["Due: uno davanti e uno dietro","Uno solo","Nessuno"], i:"Ogni ruota ha il suo freno."}}
]},
{id:"pattini", cat:"freni", nome:"Sostituire i pattini dei freni", min:15, ricambi:["pattini"], parole:["pattino","freno","cerchio"], studio:[
 {m:"SCI", t:"L'attrito consuma", p:"A ogni frenata il pattino si consuma un poco. Sui pattini ci sono delle righe: quando le righe spariscono, il pattino è consumato e la bici frena male.", a:"Guarda i pattini: si vedono ancora le righe? Disegna un pattino nuovo e un pattino consumato.", q:{d:"Quando si cambiano i pattini dei freni?", o:["Quando le righe sono sparite e la bici frena male","Ogni giorno","Mai"], i:"Guarda le righe sul pattino."}},
 {m:"MAT", t:"Più veloce vai, più strada ti serve per fermarti", p:"Lo spazio di frenata cresce con la velocità, ma più in fretta della velocità. Se la velocità diventa doppia, lo spazio per fermarti diventa circa 4 volte più lungo (2 × 2 = 4).", a:"Se a 10 km/h ti servono 2 metri per fermarti, quanti metri ti servono circa a 20 km/h?", q:{d:"A 10 km/h ti servono 2 metri per fermarti. A 20 km/h ti servono circa...", o:["8 metri","4 metri","2 metri"], i:"La velocità è doppia: lo spazio diventa 4 volte più lungo."}},
 {m:"TEC", t:"Materiali morbidi e duri", p:"Il pattino è di gomma morbida. Il cerchio è di metallo duro, l'alluminio. Si consuma il materiale più morbido: è meglio cambiare un pattino che un cerchio.", a:"Fai un elenco dei materiali della bici: metallo, gomma, plastica... Quale è il più morbido?", q:{d:"Perché il pattino è più morbido del cerchio?", o:["Così si consuma il pattino e non il cerchio","Per fare meno rumore","Per essere più bello"], i:"Che cosa costa meno cambiare?"}}
]},
{id:"cavo_freno", cat:"freni", nome:"Sostituire cavo e guaina del freno", min:20, ricambi:["cavo_freno","guaina"], parole:["cavo","guaina","freno","leva"], studio:[
 {m:"TEC", t:"Il cavo porta il movimento", p:"Il cavo d'acciaio scorre dentro la guaina. Quando tiri la leva, il cavo porta il movimento fino al freno, anche se la guaina fa una curva.", a:"Metti uno spago dentro una cannuccia piegata e tira da una parte. Che cosa succede dall'altra parte?", q:{d:"A che cosa serve la guaina?", o:["Guida il cavo anche nelle curve","Rende il cavo colorato","Gonfia la gomma"], i:"Pensa alla cannuccia con lo spago."}},
 {m:"STO", t:"Un'invenzione di fine Ottocento", p:"Il cavo dentro la guaina si chiama anche cavo Bowden, dal nome dell'inventore Ernest Bowden. È nato alla fine dell'Ottocento per i freni delle biciclette. Oggi si usa anche su moto, auto e macchine.", a:"Cercate intorno a voi altri oggetti con un cavo dentro una guaina.", q:{d:"Per che cosa è nato il cavo Bowden?", o:["Per i freni della bicicletta","Per gli aerei","Per i telefoni"], i:"Rileggi il testo: per quale mezzo è nato?"}},
 {m:"MAT", t:"Misurare e tagliare", p:"La guaina va tagliata alla lunghezza giusta. Se è troppo corta, il manubrio non gira bene. Se è troppo lunga, fa curve strette e il freno diventa duro.", a:"Misura la guaina vecchia con il metro. Scrivi la misura in centimetri e in millimetri.", q:{d:"Una guaina è lunga 45 cm. Quanti millimetri sono?", o:["450 mm","45 mm","4,5 mm"], i:"1 centimetro è uguale a 10 millimetri."}}
]},
{id:"catena_lub", cat:"trasm", nome:"Pulire e lubrificare la catena", min:15, ricambi:["sgrassatore","lubrificante"], parole:["catena","olio","ruggine"], studio:[
 {m:"SCI", t:"La ruggine", p:"La catena è di acciaio: dentro c'è ferro. Il ferro, con l'acqua e l'ossigeno dell'aria, fa la ruggine. È una reazione chimica: l'ossidazione. L'olio protegge la catena dall'acqua.", a:"Metti un chiodo in un bicchiere con acqua e un chiodo in un bicchiere asciutto. Guardali dopo qualche giorno.", q:{d:"Che cosa serve per fare la ruggine?", o:["Ferro, acqua e ossigeno","Plastica e sole","Solo il buio"], i:"Pensa al chiodo nel bicchiere con l'acqua."}},
 {m:"TEC", t:"L'olio riduce l'attrito", p:"Tra i pezzi della catena c'è attrito. L'olio fa scivolare i pezzi uno sull'altro: la catena fa meno rumore, si consuma meno e pedali meglio.", a:"Ascolta una catena secca e una catena pulita e lubrificata. Che differenza senti?", q:{d:"A che cosa serve l'olio sulla catena?", o:["Riduce l'attrito e protegge dalla ruggine","Rende la catena più pesante","Fa andare la bici da sola"], i:"Pensa a come scivolano i pezzi."}},
 {m:"CIV", t:"Olio e stracci: dove li butti?", p:"L'olio e gli stracci sporchi di olio inquinano l'acqua e la terra. Non vanno nel lavandino e nemmeno nel bidone normale. Si portano all'ecocentro.", a:"Cercate dove si trova l'ecocentro più vicino al vostro quartiere.", q:{d:"Dove porti l'olio usato?", o:["All'ecocentro","Nel lavandino","Nel prato"], i:"Deve andare in un posto dove lo trattano senza inquinare."}}
]},
{id:"catena_sost", cat:"trasm", nome:"Sostituire la catena", min:25, ricambi:["catena"], parole:["catena","corona","pignone","pedale"], studio:[
 {m:"MAT", t:"Il rapporto: denti davanti e denti dietro", p:"La catena unisce la corona (davanti) e il pignone (dietro). Se la corona ha 42 denti e il pignone 14, fai 42 : 14 = 3. A ogni giro dei pedali la ruota fa 3 giri.", a:"Conta i denti della corona e del pignone di una bici. Dividi. Quanti giri fa la ruota a ogni pedalata?", q:{d:"Corona con 36 denti, pignone con 12 denti. Quanti giri fa la ruota a ogni pedalata?", o:["3 giri","12 giri","48 giri"], i:"Dividi i denti della corona per i denti del pignone."}},
 {m:"STO", t:"La bicicletta di sicurezza", p:"Prima della catena c'era il biciclo: i pedali erano sulla ruota davanti, altissima, ed era facile cadere. Nel 1885 l'inglese John Kemp Starley costruì la Rover: ruote uguali e catena per muovere la ruota dietro. È la bici di oggi.", a:"Disegna un biciclo e una bici di oggi. Scrivi tre differenze.", q:{d:"Che cosa aveva di nuovo la Rover di Starley (1885)?", o:["Ruote uguali e una catena per la ruota dietro","I pedali sulla ruota davanti","Un motore elettrico"], i:"La Rover è molto simile alla bici di oggi."}},
 {m:"TEC", t:"La trasmissione del moto", p:"La catena trasmette il moto: porta la forza delle gambe dalla corona alla ruota dietro. Le maglie della catena entrano nei denti, come in un ingranaggio.", a:"Conta le maglie della catena vecchia. La catena nuova deve avere lo stesso numero di maglie.", q:{d:"Che cosa fa la catena?", o:["Porta il moto dai pedali alla ruota dietro","Frena la bici","Tiene ferma la sella"], i:"Segui la catena dai pedali alla ruota."}}
]},
{id:"cambio", cat:"trasm", nome:"Regolare il cambio", min:20, ricambi:[], parole:["cambio","pignone","catena"], studio:[
 {m:"MAT", t:"Quanta strada con un giro di ruota", p:"La circonferenza è la lunghezza del bordo del cerchio: diametro × 3,14 (pi greco). È la strada che la bici fa a ogni giro di ruota. Se la ruota fa 2 giri a ogni pedalata, una pedalata vale 2 circonferenze.", a:"Misura il diametro della ruota con il metro. Calcola la circonferenza.", q:{d:"Una ruota ha il diametro di 70 cm. La circonferenza è circa...", o:["220 cm","70 cm","140 cm"], i:"Fai 70 × 3,14."}},
 {m:"SCI", t:"Marce leggere e marce dure", p:"In salita usi una marcia leggera: pedali tante volte, ma con poca forza. In pianura puoi usare una marcia dura: serve più forza, ma a ogni pedalata vai più lontano.", a:"In cortile, con un adulto, prova una marcia leggera e una marcia dura. Con quale senti più forza nelle gambe?", q:{d:"Quale marcia usi in salita?", o:["Una marcia leggera","Una marcia dura","Nessuna marcia"], i:"In salita la fatica è tanta: serve meno forza a ogni pedalata."}},
 {m:"MUS", t:"Pedalare a ritmo", p:"Il numero di pedalate in un minuto si chiama cadenza. In musica il tempo di una canzone si misura in battiti al minuto (BPM). Per molti ciclisti una cadenza comoda è tra 80 e 90 pedalate al minuto.", a:"Metti una canzone e batti i piedi a tempo. Conta i battiti in 15 secondi e moltiplica per 4: sono i BPM.", q:{d:"Che cosa vuol dire BPM in musica?", o:["Battiti al minuto","Bici per metro","Bassi più medi"], i:"Pensa a «battiti» e a «minuto»."}}
]},
{id:"raggi", cat:"ruote", nome:"Centrare la ruota e tendere i raggi", min:30, ricambi:["raggio"], parole:["raggio","cerchio","mozzo","ruota"], studio:[
 {m:"MUS", t:"Il suono dei raggi", p:"Il meccanico pizzica i raggi come le corde di una chitarra. Un raggio più teso fa un suono più acuto. Un raggio lento fa un suono più grave.", a:"Pizzica i raggi di una ruota uno dopo l'altro. C'è un raggio che suona diverso?", q:{d:"Un raggio molto teso fa un suono...", o:["più acuto","più grave","nessun suono"], i:"Pensa a una corda di chitarra molto tirata."}},
 {m:"MAT", t:"Il cerchio e gli angoli", p:"Il raggio della bici ha lo stesso nome del raggio del cerchio. Sul cerchio della ruota i fori per i raggi sono alla stessa distanza. Un giro intero è 360 gradi: con 36 raggi, tra due fori vicini ci sono 360 : 36 = 10 gradi.", a:"Conta i raggi di una ruota. Calcola i gradi tra due fori vicini: 360 diviso il numero dei raggi.", q:{d:"Una ruota ha 32 raggi. Quanti gradi ci sono tra due fori vicini?", o:["11,25 gradi","32 gradi","10 gradi"], i:"Fai 360 : 32."}},
 {m:"ART", t:"Simmetria e raggiera", p:"La ruota ha una simmetria radiale: le parti si ripetono uguali intorno al centro. La trovi anche nei fiori, nei rosoni delle chiese e nei mandala.", a:"Con compasso e goniometro disegna una ruota con 12 raggi, uno ogni 30 gradi. Colorala con un motivo che si ripete.", q:{d:"Che cosa vuol dire simmetria radiale?", o:["Le parti si ripetono uguali intorno a un centro","Le parti sono tutte diverse","C'è solo una linea dritta"], i:"Pensa ai petali di un fiore."}},
 {m:"TEC", t:"Una struttura in tensione", p:"I raggi sono sottili, ma tutti insieme tengono il cerchio rotondo e robusto. Devono avere tutti la stessa tensione. Se un raggio è lento, la ruota si storce.", a:"Fai girare la ruota e guarda il cerchio vicino al pattino del freno. Si sposta a destra e a sinistra? Allora la ruota va centrata.", q:{d:"Che cosa succede se un raggio è lento?", o:["La ruota si storce","La ruota diventa più leggera","La gomma si gonfia"], i:"Tutti i raggi devono tirare allo stesso modo."}}

function datiVuoti(){
  return {versione:1, impostazioni:impostazioniBase(), listino:LISTINO_BASE.map(x => ({...x})), officine:[]};
}
function normalizzaOfficina(o){
  o.clienti = Array.isArray(o.clienti) ? o.clienti : [];
  o.schede = Array.isArray(o.schede) ? o.schede : [];
  o.quiz = o.quiz && typeof o.quiz === "object" ? o.quiz : {};
  o.imprevisti = Array.isArray(o.imprevisti) ? o.imprevisti : [];
  o.contatore = +o.contatore || o.schede.length;
  o.abilVisti = +o.abilVisti || 0;
  o.simbolo = o.simbolo || "ruota";
  o.colore = o.colore || "#C2410C";
  o.schede.forEach(s => {
    s.bici = s.bici || {}; s.controllo = s.controllo || {}; s.lavori = s.lavori || []; s.ricambi = s.ricambi || [];
    s.stato = s.stato || "bozza"; s.foto = Array.isArray(s.foto) ? s.foto : [];
  });
  return o;
}
function normalizza(){
  if(!D || typeof D !== "object") D = datiVuoti();
  D.impostazioni = Object.assign(impostazioniBase(), D.impostazioni || {});
  if(!Array.isArray(D.listino)) D.listino = LISTINO_BASE.map(x => ({...x}));
  if(!Array.isArray(D.officine)) D.officine = [];
  D.officine.forEach(normalizzaOfficina);
}
function carica(){
  try{ localStorage.setItem("bicilab.prova", "1"); localStorage.removeItem("bicilab.prova"); }catch(e){ memoriaOk = false; }
  try{ const t = localStorage.getItem(CHIAVE); D = t ? JSON.parse(t) : datiVuoti(); }catch(e){ D = datiVuoti(); }
  normalizza();
  try{ P = JSON.parse(localStorage.getItem(CHIAVE_PREF)) || {}; }catch(e){ P = {}; }
  const riduci = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  P = Object.assign({testo:"normale", spazio:false, maiuscolo:false, sfondo:"crema", voce:true, disegni:true, movimento:!riduci}, P);
}
function salva(){
  const o = off(); if(o) o.aggiornata = new Date().toISOString();
  try{ localStorage.setItem(CHIAVE, JSON.stringify(D)); }
  catch(e){ if(memoriaOk){ memoriaOk = false; toast("Attenzione: i dati non si salvano. Prima di chiudere, salva una copia dall'area educatore."); } }
}
function salvaPref(){ try{ localStorage.setItem(CHIAVE_PREF, JSON.stringify(P)); }catch(e){} applicaPref(); }
function applicaPref(){
  const r = document.documentElement;
  r.classList.toggle("t-grande", P.testo === "grande");
  r.classList.toggle("t-mgrande", P.testo === "mgrande");
  r.dataset.sfondo = P.sfondo;
  r.classList.toggle("fermo", !P.movimento);
  document.body.classList.toggle("spazio", !!P.spazio);
  document.body.classList.toggle("maiuscolo", !!P.maiuscolo);
}

function dataIT(v){

  let d = /^\d{4}-\d{2}-\d{2}$/.test(v) ? new Date(+v.slice(0,4), +v.slice(5,7) - 1, +v.slice(8,10)) : new Date(v);
  if(isNaN(d)) return "";
  return d.toLocaleDateString("it-IT", {day:"numeric", month:"long", year:"numeric"});
}
function leggiNumero(t){
  let s = String(t == null ? "" : t).replace(/€|euro|eur/gi, "").replace(/\s/g, "");
  if(!s) return NaN;
  if(s.includes(",") && s.includes(".")) s = s.replace(/\./g, "").replace(",", ".");
  else s = s.replace(",", ".");
  if(!/^-?\d*\.?\d+$/.test(s)) return NaN;
  return parseFloat(s);
}
function hs(s){ let x = 2166136261; for(let i = 0; i < s.length; i++){ x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; }
function mescola(arr, seed){
  const a = arr.slice(); let x = seed || 1;
  for(let i = a.length - 1; i > 0; i--){ x = (Math.imul(x, 1103515245) + 12345) >>> 0; const j = x % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function ico(n, cls){ return '<svg class="ico ' + (cls || "") + '" aria-hidden="true" focusable="false"><use href="#i-' + n + '"/></svg>'; }
function elenco(arr){ if(arr.length <= 1) return arr.join(""); return arr.slice(0, -1).join(", ") + " e " + arr[arr.length - 1]; }
function toast(msg){
  const el = $("#avviso"); el.textContent = msg; el.classList.add("vis");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("vis"), 4800);
}

const haVoce = "speechSynthesis" in window;
function vociLocali(){ try{ return speechSynthesis.getVoices().filter(v => v.localService); }catch(e){ return []; } }
function parla(testo, lang){
  if(!haVoce){ toast("Questo browser non sa leggere ad alta voce."); return; }
  const pref = (lang || "it-IT").slice(0, 2).toLowerCase();
  const prova = () => {
    const voci = vociLocali();
    const v = voci.find(v => v.lang.replace("_", "-").toLowerCase() === (lang || "it-IT").toLowerCase()) || voci.find(v => v.lang.toLowerCase().startsWith(pref));
    if(!v){ toast("Su questo dispositivo non c'è una voce offline per questa lingua."); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(testo); u.voice = v; u.lang = v.lang; u.rate = .9;
    speechSynthesis.speak(u);
  };
  if(speechSynthesis.getVoices().length) prova();
  else { speechSynthesis.onvoiceschanged = () => { speechSynthesis.onvoiceschanged = null; prova(); }; setTimeout(() => { if(!speechSynthesis.speaking) prova(); }, 700); }
}
function btnVoce(testo, lang, etichetta){
  if(!P.voce || !haVoce) return "";
  return '<button type="button" class="btn-voce" data-act="parla" data-t="' + h(testo) + '" data-l="' + (lang || "it-IT") + '">' + ico("voce") + '<span>' + h(etichetta || "Ascolta") + '</span></button>';
}

/* ---------------- CALCOLI ---------------- */
function calcola(s){
  const righe = s.ricambi.map(r => ({nome:r.nome, qta:+r.qta || 0, prezzo:+r.prezzo || 0, tot:r2((+r.qta || 0) * (+r.prezzo || 0)), recupero:r.recupero}));
  const ricambi = r2(righe.reduce((a, r) => a + r.tot, 0));
  const minuti = s.lavori.reduce((a, l) => a + (+l.min || 0), 0);
  const tariffa = s.tariffa != null ? +s.tariffa : +D.impostazioni.tariffa;
  const manodopera = r2(minuti / 60 * tariffa);
  const subtotale = r2(ricambi + manodopera);
  const scontoPct = +s.scontoPct || 0;
  const sconto = r2(subtotale * scontoPct / 100);
  const imponibile = r2(subtotale - sconto);
  const ivaPct = +s.ivaPct || 0;
  const iva = r2(imponibile * ivaPct / 100);
  const totale = r2(imponibile + iva);
  return {righe, ricambi, minuti, tariffa, manodopera, subtotale, scontoPct, sconto, imponibile, ivaPct, iva, totale};
}
function firmaConto(s){
  const c = calcola(s);
  return JSON.stringify([c.righe.map(r => [r.qta, r.prezzo]), c.minuti, c.tariffa, c.scontoPct, c.ivaPct]);
}
function contoNuovo(firma){ return {firma, risp:{}, esito:{}, tent:{}, msg:{}, pass:{}, ok:false, aiuto:false, rivelato:false, modo:null}; }
function allineaConto(s){
  const f = firmaConto(s);
  if(!s.conto || s.conto.firma !== f){ s.conto = contoNuovo(f); salva(); }
}
const contoVisibile = s => !!(s.conto && (s.conto.ok || s.conto.rivelato) && s.conto.firma === firmaConto(s));
function campiConto(c){
  const f = [];
  if(c.righe.length) f.push({k:"ricambi", lab:"Totale dei ricambi", v:c.ricambi});
  f.push({k:"manodopera", lab:"Manodopera", v:c.manodopera});
  if(c.scontoPct > 0 || c.ivaPct > 0) f.push({k:"subtotale", lab:"Ricambi + manodopera", v:c.subtotale});
  if(c.scontoPct > 0) f.push({k:"sconto", lab:"Sconto del " + c.scontoPct + " % (quanto togli)", v:c.sconto});
  if(c.ivaPct > 0) f.push({k:"iva", lab:"IVA del " + c.ivaPct + " %", v:c.iva});
  f.push({k:"totale", lab:"Totale da pagare", v:c.totale});
  return f;
}
const vicino = (a, b) => Math.abs(a - b) < 0.011;
function totaleDaRisposte(k, c){
  const g = x => leggiNumero(k.risp[x]);
  let t;
  if(c.scontoPct > 0 || c.ivaPct > 0){ t = g("subtotale") - (c.scontoPct > 0 ? g("sconto") : 0) + (c.ivaPct > 0 ? g("iva") : 0); }
  else t = (c.righe.length ? g("ricambi") : 0) + g("manodopera");
  return isNaN(t) ? null : r2(t);
}
function indizio(campo, c, ans, tent, k){
  const t = c.tariffa, m = c.minuti;
  switch(campo){
    case "ricambi": {
      const senzaQ = r2(c.righe.reduce((a, r) => a + r.prezzo, 0));
      if(c.righe.some(r => r.qta > 1) && vicino(ans, senzaQ)) return "Hai sommato i prezzi, ma hai dimenticato le quantità. Moltiplica ogni prezzo per la sua quantità.";
      if(tent === 1) return "Per ogni ricambio fai: quantità × prezzo. Poi somma tutti i risultati.";
      return "Fai così: " + c.righe.map(r => r.qta + " × " + euro(r.prezzo)).join(" + ") + ". Usa la calcolatrice, se ti aiuta.";
    }
    case "manodopera": {
      if(m > 0 && vicino(ans, r2(m * t))) return "Attenzione: " + euro(t) + " è il prezzo di un'ora, non di un minuto. Prima trasforma i minuti in ore.";
      if(m > 0 && m % 60 !== 0 && vicino(ans, r2(m / 100 * t))) return "Attenzione: un'ora ha 60 minuti, non 100. Per avere le ore dividi i minuti per 60.";
      if(m > 0 && vicino(ans, r2(m / 60))) return "Hai trovato le ore: " + num(m / 60) + ". Adesso moltiplica per la tariffa: " + euro(t) + " all'ora.";
      if(tent === 1) return "Somma i minuti di tutti i lavori. Dividi per 60: trovi le ore. Poi moltiplica per la tariffa: " + euro(t) + " all'ora.";
      return "In tutto sono " + m + " minuti. Fai " + m + " : 60 per avere le ore, poi moltiplica per " + num(t) + "." + (t % 12 === 0 ? " Trucco: 5 minuti costano " + euro(t / 12) + "." : "");
    }
    case "subtotale":
      if(vicino(ans, c.ricambi) || vicino(ans, c.manodopera)) return "Qui devi sommare due numeri: i ricambi e la manodopera.";
      return "Somma il totale dei ricambi e la manodopera.";
    case "sconto":
      if(vicino(ans, c.scontoPct)) return "Lo sconto del " + c.scontoPct + " % non vuol dire " + c.scontoPct + " euro: dipende dal prezzo.";
      if(vicino(ans, r2(c.subtotale - c.sconto))) return "Hai scritto il prezzo già scontato. Qui serve solo lo sconto: quanto togli.";
      if(tent === 1) return c.scontoPct + " % vuol dire " + c.scontoPct + " euro ogni 100 euro. Si calcola su ricambi + manodopera.";
      return "Fai: " + num(c.subtotale) + " × " + c.scontoPct + " : 100.";
    case "iva":
      if(vicino(ans, c.ivaPct)) return "IVA del " + c.ivaPct + " % non vuol dire " + c.ivaPct + " euro: dipende dal prezzo.";
      if(vicino(ans, r2(c.imponibile + c.iva))) return "Hai scritto il totale con l'IVA. Qui serve solo l'IVA.";
      if(tent === 1) return "L'IVA è il " + c.ivaPct + " %: " + c.ivaPct + " euro ogni 100 euro. Si calcola sul prezzo dopo lo sconto.";
      return "Fai: " + num(c.imponibile) + " × " + c.ivaPct + " : 100.";
    case "totale": {
      const mio = totaleDaRisposte(k, c);
      if(mio != null && vicino(ans, mio)) return "Il tuo ultimo calcolo è giusto con i tuoi numeri, ma un numero di prima non è giusto. Controllalo.";
      if(c.scontoPct > 0 && vicino(ans, r2(c.subtotale + (c.ivaPct ? r2(c.subtotale * c.ivaPct / 100) : 0)))) return "Hai dimenticato di togliere lo sconto.";
      if(c.scontoPct > 0 && vicino(ans, r2(c.subtotale + c.sconto + c.iva))) return "Lo sconto si toglie, non si aggiunge.";
      if(c.ivaPct > 0 && vicino(ans, c.imponibile)) return "Hai dimenticato di aggiungere l'IVA.";
      const formula = (c.scontoPct > 0 || c.ivaPct > 0) ? "(ricambi + manodopera)" + (c.scontoPct > 0 ? " − sconto" : "") + (c.ivaPct > 0 ? " + IVA" : "") : (c.righe.length ? "ricambi + manodopera" : "solo la manodopera");
      if(tent === 1) return "Il totale è: " + formula + ".";
      return "Usa i numeri giusti che hai trovato sopra e fai: " + formula + ".";
    }
  }
  return "";
}
function passaggi(campo, c){
  switch(campo){
    case "ricambi": return c.righe.map(r => r.qta + " × " + euro(r.prezzo) + " = " + euro(r.tot)).concat(["Somma: " + euro(c.ricambi)]);
    case "manodopera": return [c.minuti + " minuti : 60 = " + num(c.minuti / 60) + " ore", num(c.minuti / 60) + " × " + euro(c.tariffa) + " = " + euro(c.manodopera)];
    case "subtotale": return [euro(c.ricambi) + " + " + euro(c.manodopera) + " = " + euro(c.subtotale)];
    case "sconto": return [num(c.subtotale) + " × " + c.scontoPct + " : 100 = " + euro(c.sconto)];
    case "iva": return [euro(c.subtotale) + (c.scontoPct ? " − " + euro(c.sconto) + " = " + euro(c.imponibile) : ""), num(c.imponibile) + " × " + c.ivaPct + " : 100 = " + euro(c.iva)];
    case "totale":
      if(c.scontoPct > 0 || c.ivaPct > 0) return [euro(c.subtotale) + (c.scontoPct ? " − " + euro(c.sconto) : "") + (c.ivaPct ? " + " + euro(c.iva) : "") + " = " + euro(c.totale)];
      return [(c.righe.length ? euro(c.ricambi) + " + " : "") + euro(c.manodopera) + " = " + euro(c.totale)];
  }
  return [];
}

/* ---------------- PERCORSO ---------------- */
function abilitazioni(o){
  let bloccata = false;
  return ABIL.map((a, i) => {
    const fatta = !bloccata && a.f(o);
    const stato = fatta ? "superata" : (bloccata ? "bloccata" : "corrente");
    if(!fatta) bloccata = true;
    return {...a, ok:fatta, stato, i};
  });
}
const nAbil = o => abilitazioni(o).filter(a => a.ok).length;
function controllaAbilitazioni(){
  const o = off(); if(!o) return;
  const ab = abilitazioni(o); const n = ab.filter(a => a.ok).length;
  if(n > o.abilVisti){
    const nuove = ab.slice(o.abilVisti, n).map(a => a.n); o.abilVisti = n; salva();
    const tit = nuove.length > 1 ? "Prove superate: " + elenco(nuove) + "!" : "Prova superata: " + nuove[0] + "!";
    setTimeout(() => festa(tit, "Livello: " + LIVELLI[n]), 250);
  }
  else if(n < o.abilVisti){ o.abilVisti = n; salva(); }
}

/* ---------------- COSA STUDIO: contenuti ---------------- */
function itemLingua(def, m){
  const cod = m === "ING" ? "en" : D.impostazioni.lingua2;
  const L = LINGUE[cod];
  const parole = def.parole.map(p => VOC[p]).filter(Boolean);
  const scelta = parole[hs(def.id) % parole.length];
  const giusta = scelta[L.i];
  const altre = Object.keys(VOC).filter(k => !def.parole.includes(k)).map(k => VOC[k][L.i]).filter((t, i, a) => t !== giusta && a.indexOf(t) === i);
  const x = hs(def.id + cod);
  const d1 = altre[x % altre.length]; const resto = altre.filter(t => t !== d1); const d2 = resto[(x >>> 5) % resto.length];
  return {m, key:def.id + ":" + m + ":" + cod, lingua:cod, t:"Le parole del mestiere in " + L.n,
    p:"In officina può arrivare un cliente che parla " + L.n + ". Ecco le parole di questo lavoro.",
    a:"Leggi le parole ad alta voce. Poi copri la colonna in " + L.n + " e prova a ricordarle.",
    parole, q:{d:"Come si dice «" + scelta[0] + "» in " + L.n + "?", o:[giusta, d1, d2], i:"Cerca la parola nell'elenco qui sopra."}};
}
function itemsDi(def){
  const items = def.studio.map((it, i) => ({...it, key:def.id + ":" + i}));
  if(def.parole && def.parole.length){ items.push(itemLingua(def, "ING")); items.push(itemLingua(def, "L2")); }
  return items;
}
function blocchiStudio(s){
  const b = [{id:"base", nome:BASE.nome, items:itemsDi(BASE)}];
  s.lavori.forEach(l => { const def = LAV[l.id]; if(def && !b.some(x => x.id === def.id)) b.push({id:def.id, nome:def.nome, items:itemsDi(def)}); });
  if(s.foto && s.foto.length) b.push({id:"foto", nome:FOTO_STUDIO.nome, items:itemsDi(FOTO_STUDIO)});
  return b;
}
function materieDiScheda(s){
  const set = new Set(); blocchiStudio(s).forEach(b => b.items.forEach(it => set.add(it.m)));
  return ORDINE_MATERIE.filter(m => set.has(m));
}
function tuttiGliItems(){
  const out = [];
  [BASE].concat(LAVORI, [FOTO_STUDIO]).forEach(def => itemsDi(def).forEach(it => out.push({...it, lavoro:def.id, lavoroNome:def.nome})));
  return out;
}

function render(){
